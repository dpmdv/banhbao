<style>
:root{
  --bg:#F4F4F6; --side:#FFFFFF; --surface:#FFFFFF; --sunk:#F8F8FA; --hover:#F4F2F5;
  --ink:#24212A; --ink2:#46424E; --muted:#85808C; --line:#ECEBEF; --line2:#E0DEE4;
  --inv:#FF6B9D; --inv-ink:#FFFFFF; --chip:#F1EFF3;
  --good:#1FA971; --warn:#E39B10; --bad:#E5484D; --link:#E8467E;
  --cL:#2F9BEA; --cR:#18A874; --cW:#FF7A3D; --cS:#8E5CF7; --cV:#FF5C93; --cG:#F2A900; --cP:#14B8C4;
  --shadow:0 8px 18px -12px rgba(255,92,147,.55);
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  --sans:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --read:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --hl:#FFE58A; --scene:1; --sky1:#FFF1F5; --sky2:#FFFCF6; --sun:#FFD66B; --cloud:#FFFFFF; --stars:0;
  color-scheme:light;
}
/* Màu: mặc định theo sáng/tối của thiết bị; có thể chọn cố định Sáng / Hồng / Tối (data-bb) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-bb="light"]){
  --bg:#110E12; --side:#19151B; --surface:#1E1A21; --sunk:#252029; --hover:#2C2630;
  --ink:#F2ECF2; --ink2:#D3C9D4; --muted:#9A8F9D; --line:#2E2832; --line2:#3B333F;
  --inv:#FF6B9D; --chip:#352C38; --good:#4FD39A; --bad:#FF6B6F; --link:#FF8DB4;
  --shadow:0 10px 22px -12px rgba(0,0,0,.9); --hl:#7A6420; --scene:1; --sky1:#1F1A3D; --sky2:#3B2547; --sun:#F6E9B8; --cloud:#4A3F63; --stars:1;
  color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-bb="light"]),:root[data-bb="dark"]{
  --bg:#110E12; --side:#19151B; --surface:#1E1A21; --sunk:#252029; --hover:#2C2630;
  --ink:#F2ECF2; --ink2:#D3C9D4; --muted:#9A8F9D; --line:#2E2832; --line2:#3B333F;
  --inv:#FF6B9D; --chip:#352C38; --good:#4FD39A; --bad:#FF6B6F; --link:#FF8DB4;
  --shadow:0 10px 22px -12px rgba(0,0,0,.9); --hl:#7A6420; --scene:1; --sky1:#1F1A3D; --sky2:#3B2547; --sun:#F6E9B8; --cloud:#4A3F63; --stars:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--inv);outline-offset:2px}
input[type=range],input[type=checkbox],input[type=radio]{accent-color:var(--inv)}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
a{color:var(--link)}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%;padding:14px;gap:14px}
.app.collapsed{grid-template-columns:64px minmax(0,1fr)}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;min-height:0;border:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.logo{width:42px;height:42px;border-radius:50%;flex:none;display:block}
.logo svg{width:42px;height:42px;display:block}
.brand-t{flex:1;min-width:0}
.brand-t b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.brand-t small{font-family:var(--sans);font-size:11px;color:var(--muted)}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}
.search{margin:2px 14px 10px;display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:7px 8px 7px 10px;color:var(--muted);width:calc(100% - 28px);text-align:left}
.search:hover{border-color:var(--line2);color:var(--ink2)}
.search svg{width:15px;height:15px;flex:none}
.search span{flex:1}
.search kbd{font-family:inherit;font-size:10px;border:1px solid var(--line2);border-radius:5px;padding:0 5px}
.sidescroll{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px 10px}
.navlabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.navi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink2);text-align:left;width:100%}
.navi svg{width:17px;height:17px;flex:none;color:var(--nc,var(--muted))}
.navi span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navi .badge{flex:none}
.navi:hover{background:var(--hover)}
.navi.on{background:var(--inv);color:var(--inv-ink);box-shadow:var(--shadow)}
.navi.on svg{color:var(--inv-ink)}
.badge{font-size:11px;background:var(--chip);color:var(--muted);border-radius:5px;padding:0 6px;min-width:20px;text-align:center;flex:none}
.navi.on .badge{background:rgba(255,255,255,.3);color:#fff}
.sidefoot{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{white-space:nowrap;flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:5px 4px;border-radius:7px;font-size:11px;color:var(--muted)}
.seg button svg{width:13px;height:13px}
.seg button.on{background:var(--inv);color:var(--inv-ink)}
.collapsed .brand-t,.collapsed .search span,.collapsed .search kbd,.collapsed .navi span,.collapsed .navi .badge,.collapsed .navlabel,.collapsed .seg button span,.collapsed .ft-mid,.collapsed .ft-x{display:none}
.collapsed .brand{flex-direction:column;padding-inline:0}
.collapsed .search{justify-content:center;padding:8px 0;margin-inline:10px;width:calc(100% - 20px)}
.collapsed .navi{justify-content:center;padding:9px 0}
.collapsed .seg{flex-direction:column}
.collapsed .ft{margin:0 8px 10px;padding:8px 0;align-items:center}

/* focus timer (giống Tao) */
.ft{margin:6px 12px 12px;border-radius:14px;padding:10px 10px 10px 8px;display:flex;flex-direction:column;gap:9px;background:var(--sunk);border:1px solid var(--line)}
.ft-row{display:flex;align-items:center;gap:10px}
.ft-ring{position:relative;width:46px;height:46px;flex:none;color:var(--ink)}
.ft-ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ft-ring circle{fill:none;stroke-width:3}
.ft-ring .trk{stroke:var(--line2)}
.ft-ring .val{stroke:var(--inv);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ft.brk .ft-ring .val{stroke:var(--good)}
.ft-ring span{position:absolute;inset:0;display:grid;place-items:center}
.ft-ring span svg{width:16px;height:16px;transform:none}
.ft-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ft-mid b{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.ft-mid b small{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.ft-sub{font-size:11.5px;color:var(--muted)}
.ft-x{color:var(--muted)}

/* ---------- main ---------- */
.main{background:var(--surface);border-radius:14px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.menubtn{display:none}
.clockbar{display:flex;align-items:baseline;gap:10px;min-width:0}
.clockbar b{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clockbar b small{font-size:12px;color:var(--muted);font-weight:400}
.clockbar span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.pill svg{width:15px;height:15px}
.pill b{font-variant-numeric:tabular-nums}
.pill.fire svg{color:#FF7A3D}
.pill.exam svg{color:var(--inv)}
button.pill:hover{border-color:var(--line2)}
.content{flex:1;overflow:auto;padding:18px;min-height:0;scroll-behavior:smooth}
.view{display:flex;flex-direction:column;gap:18px;max-width:1240px;margin:0 auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-size:12px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--inv);color:var(--inv-ink);border-color:var(--inv);box-shadow:var(--shadow)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{padding:4px 9px;font-size:11px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}

/* hero */
.hero{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:168px;display:flex;background:var(--surface)}
.hero-t{position:relative;z-index:1;padding:22px 28px;display:flex;flex-direction:column;justify-content:center;gap:8px;max-width:60%}
.eyebrow{font-size:19px;letter-spacing:.03em;text-transform:uppercase;color:var(--inv);font-weight:700}
.hero-q{font-size:14px;line-height:1.6;color:var(--ink2);font-style:italic;font-weight:500;max-width:52ch;text-wrap:pretty}
.hero-q small{display:block;font-style:normal;color:var(--muted);font-size:11.5px;margin-top:4px}
.hero .scene{position:absolute;right:0;top:0;height:100%;width:52%;pointer-events:none}
.hero .scene svg{width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0 0 0 auto;width:52%;background:linear-gradient(90deg,var(--surface) 0%,transparent 30%);pointer-events:none}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.tabs button{padding:5px 12px;border-radius:7px;font-size:12px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(120,40,80,.15)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:10px}
.sec-h svg{width:15px;height:15px;color:var(--ac,var(--muted))}
.sec-h .spacer{flex:1}
.sec-h a,.sec-h .lnk{font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer}
.sec-h .lnk:hover{color:var(--ink)}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sunk{background:var(--sunk)}
.card h4{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.card h4 svg{width:15px;height:15px;color:var(--ac,var(--muted));flex:none}
.k,.tiny{font-size:11.5px;color:var(--muted)}
.tiny{font-size:11px}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar b{display:block;height:100%;background:var(--ac,var(--inv));border-radius:3px;transition:width .4s}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px 8px;color:var(--ink2);white-space:nowrap}
.tag.ac{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 35%,transparent);background:color-mix(in srgb,var(--ac) 8%,var(--surface))}
.pagehead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pagehead .ph-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,var(--surface));color:var(--ac);flex:none}
.pagehead .ph-ic svg{width:22px;height:22px}
.pagehead h1{font-size:22px;letter-spacing:-.02em}
.pagehead p{font-size:12px;color:var(--muted);margin-top:2px;max-width:80ch}
.pagehead .ph-t{flex:1;min-width:220px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px}

/* màu theo kỹ năng */
.c-L{--ac:var(--cL)}.c-R{--ac:var(--cR)}.c-W{--ac:var(--cW)}.c-S{--ac:var(--cS)}.c-V{--ac:var(--cV)}.c-G{--ac:var(--cG)}.c-P{--ac:var(--cP)}.c-D{--ac:var(--inv)}

/* tasks hôm nay */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.task{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;text-align:left;width:100%;background:var(--surface)}
.task:hover{background:var(--sunk);border-color:var(--line2)}
.cbox{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none}
.task.done .cbox{background:var(--good);border-color:var(--good)}
.task.done .cbox::after{content:"";width:9px;height:4.5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.task .tic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,var(--surface));color:var(--ac)}
.task .tic svg{width:15px;height:15px}
.task .tt{font-weight:600}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .td{font-size:11px;color:var(--muted)}
.task .tm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.qs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qs .card{padding:10px;flex-direction:row;align-items:center;gap:10px}
.qs .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,var(--surface));color:var(--ac);flex:none}
.qs .ic svg{width:15px;height:15px}
.qs b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.qs small{display:block;font-size:11px;color:var(--muted);line-height:1.2}

/* skill tiles */
.skills4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;background:var(--surface);transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover{border-color:color-mix(in srgb,var(--ac) 50%,var(--line));box-shadow:0 6px 18px -10px color-mix(in srgb,var(--ac) 70%,transparent);transform:translateY(-1px)}
.tile .pic{height:70px;background:color-mix(in srgb,var(--ac) 10%,var(--surface));display:grid;place-items:center;color:var(--ac);position:relative}
.tile .pic svg{width:34px;height:34px}
.tile .pic .tag{position:absolute;top:8px;right:8px}
.tile .b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.tile h4{font-size:13.5px;font-weight:600}
.tile p{font-size:11.5px;color:var(--muted);flex:1}
.tile .foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);gap:6px}
.score{font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}

/* band meter */
.bandrow{display:grid;grid-template-columns:86px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:12px}
.bandrow .bar{height:8px;position:relative;overflow:visible}
.bandrow .bar i{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);border-radius:1px}
.bandrow b{text-align:right;font-variant-numeric:tabular-nums}

/* ô nhập */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11px;color:var(--muted)}
.inp{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.inp:focus{border-color:var(--inv);outline:none;background:var(--surface)}
textarea.inp{min-height:90px;resize:vertical;line-height:1.6}
select.inp{cursor:pointer}

/* bài làm: reading / listening */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.passage{border:1px solid var(--line);border-radius:14px;padding:22px 24px;font-family:var(--read);font-size:14.5px;line-height:1.75;color:var(--ink);position:sticky;top:0;max-height:calc(100vh - 150px);overflow:auto}
.passage h2{font-family:var(--read);font-size:19px;margin-bottom:4px}
.passage .sub{font-size:12px;color:var(--muted);font-family:var(--mono);margin-bottom:14px}
.passage p{margin:0 0 12px}
.passage p b.pl{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:color-mix(in srgb,var(--ac) 14%,var(--surface));color:var(--ac);font-size:12px;margin-right:8px;font-family:var(--mono)}
mark.hl{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.qpanel{display:flex;flex-direction:column;gap:14px}
.qgroup{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.qgroup .gi{font-size:12px;color:var(--ink2);background:var(--sunk);border-radius:9px;padding:8px 10px;line-height:1.55}
.qgroup .gi b{color:var(--ac)}
.q{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.qn{width:26px;height:26px;border-radius:7px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.q.ok .qn{background:var(--good);color:#fff;border-color:var(--good)}
.q.no .qn{background:var(--bad);color:#fff;border-color:var(--bad)}
.qt{font-family:var(--read);font-size:13.5px;line-height:1.6;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 9px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-family:var(--read);font-size:13px;line-height:1.5}
.opt:hover{background:var(--sunk)}
.opt input{margin-top:3px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.tfng{display:flex;gap:6px;flex-wrap:wrap}
.tfng label{border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font-size:11.5px;cursor:pointer}
.tfng input{display:none}
.tfng label:has(input:checked){background:var(--ac);border-color:var(--ac);color:#fff}
.tfng label.right{box-shadow:0 0 0 2px var(--good)}
.gapin{display:inline-block;width:150px;max-width:100%;border:0;border-bottom:1.5px solid var(--line2);background:var(--sunk);border-radius:6px 6px 0 0;padding:2px 8px;font-family:var(--mono);font-size:12.5px;margin:0 2px}
.gapin:focus{outline:none;border-bottom-color:var(--ac)}
.q.ok .gapin{border-bottom-color:var(--good)}
.q.no .gapin{border-bottom-color:var(--bad)}
.expl{font-size:11.5px;color:var(--ink2);background:color-mix(in srgb,var(--ac) 7%,var(--surface));border-left:3px solid var(--ac);border-radius:0 8px 8px 0;padding:6px 10px;margin-top:6px;line-height:1.55}
.expl b{color:var(--good)}
.result{border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center;background:color-mix(in srgb,var(--ac) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--ac) 30%,var(--line))}
.result .bbm{width:74px;height:74px;flex:none}
.result h3{font-size:18px}
.result .big{font-size:30px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums;line-height:1}
.stickybar{position:sticky;bottom:-18px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 0;margin:0 0 -18px;display:flex;gap:8px;align-items:center;z-index:3}
.timerchip{font-variant-numeric:tabular-nums;font-weight:600}
.timerchip.low{color:var(--bad)}

/* listening player */
.player{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,color-mix(in srgb,var(--cL) 9%,var(--surface)),var(--surface))}
.player .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.playbtn{width:46px;height:46px;border-radius:50%;background:var(--cL);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--cL)}
.playbtn svg{width:20px;height:20px}
.wave{display:flex;gap:3px;align-items:center;height:26px}
.wave i{width:3px;border-radius:2px;background:var(--cL);opacity:.35;height:30%}
.wave.on i{animation:wv 1s ease-in-out infinite;opacity:.9}
.wave i:nth-child(2n){animation-delay:.2s}.wave i:nth-child(3n){animation-delay:.4s}.wave i:nth-child(5n){animation-delay:.1s}
@keyframes wv{0%,100%{height:25%}50%{height:100%}}
.script{font-family:var(--read);font-size:13.5px;line-height:1.7;display:flex;flex-direction:column;gap:6px}
.script .ln{padding:4px 8px;border-radius:8px}
.script .ln.cur{background:color-mix(in srgb,var(--cL) 14%,var(--surface))}
.script .sp{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--cL);margin-right:6px}
.blur{filter:blur(5px);user-select:none}

/* writing */
.prompt{border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-family:var(--read);font-size:14px;line-height:1.7;background:var(--sunk)}
.prompt .pt{font-family:var(--mono);font-size:11px;color:var(--ac);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.editor{width:100%;min-height:380px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-family:var(--read);font-size:14.5px;line-height:1.8;resize:vertical;background:var(--surface)}
.editor:focus{outline:none;border-color:var(--ac)}
.wstat{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.wstat b{color:var(--ink);font-variant-numeric:tabular-nums}
.checks{display:flex;flex-direction:column;gap:6px}
.checks .ck{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5}
.checks .ck .ckic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;flex:none;color:#fff;margin-top:1px}
.ck.good .ckic{background:var(--good)}.ck.warn .ckic{background:var(--warn)}.ck.bad .ckic{background:var(--bad)}
.sample{font-family:var(--read);font-size:14px;line-height:1.75;white-space:pre-wrap}
.guide ol,.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.6}
.phr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;font-size:12.5px}
.phr .en{font-family:var(--read);font-weight:500}
.phr .vi{color:var(--muted)}
.phr>div{padding:6px 0;border-bottom:1px dashed var(--line)}

/* speaking */
.cue{border:2px dashed color-mix(in srgb,var(--cS) 45%,var(--line));border-radius:16px;padding:18px 20px;font-family:var(--read);font-size:14.5px;line-height:1.7;background:color-mix(in srgb,var(--cS) 5%,var(--surface))}
.cue h3{font-family:var(--read);font-size:16.5px;margin-bottom:8px}
.cue ul{margin:6px 0 0;padding-left:20px}
.bigtimer{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--cS);line-height:1}
.qlist{display:flex;flex-direction:column;gap:6px}
.sq{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-family:var(--read);font-size:13.5px;text-align:left;width:100%}
.sq:hover{background:var(--sunk)}
.sq.on{border-color:var(--cS);background:color-mix(in srgb,var(--cS) 7%,var(--surface))}
.sq svg{width:15px;height:15px;color:var(--cS);flex:none}
.recbox{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.transcript{font-family:var(--read);font-size:13.5px;line-height:1.7;background:var(--sunk);border-radius:10px;padding:10px 12px;min-height:48px}
.transcript .interim{color:var(--muted)}
.filler{background:color-mix(in srgb,var(--warn) 30%,transparent);border-radius:4px;padding:0 2px}

/* vocab */
.words{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.word{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word:hover{background:var(--sunk)}
.word .w{font-family:var(--read);font-weight:700;font-size:14.5px}
.word .w small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:6px}
.word .m{font-size:12.5px}
.word .ex{font-family:var(--read);font-size:12.5px;color:var(--muted);font-style:italic}
.word.learned .w::after{content:"✓";color:var(--good);margin-left:6px;font-size:12px}
.flash{perspective:1200px;width:min(520px,100%);height:300px;margin:0 auto;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:var(--surface);box-shadow:0 18px 40px -24px color-mix(in srgb,var(--ac) 80%,transparent)}
.flash .fback{transform:rotateY(180deg);background:color-mix(in srgb,var(--ac) 7%,var(--surface))}
.flash .fw{font-family:var(--read);font-size:34px;font-weight:700;letter-spacing:-.02em}
.flash .fm{font-size:18px;font-weight:600}
.flash .fe{font-family:var(--read);font-size:13.5px;color:var(--muted);font-style:italic;max-width:42ch}

/* tra từ */
.dsearch{display:flex;gap:8px;align-items:center;border:2px solid var(--line2);border-radius:14px;padding:6px 6px 6px 14px;background:var(--surface)}
.dsearch:focus-within{border-color:var(--inv)}
.dsearch svg{width:18px;height:18px;color:var(--muted)}
.dsearch input{flex:1;border:0;outline:none;background:transparent;font-family:var(--read);font-size:17px;padding:6px 0;min-width:0}
.entry h2{font-family:var(--read);font-size:30px;letter-spacing:-.02em}
.ipa{font-family:var(--read);color:var(--muted);font-size:14px}
.pos{display:inline-block;font-size:11px;font-weight:700;color:var(--inv);background:var(--chip);border-radius:6px;padding:1px 8px;margin:8px 0 4px}
.defs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-family:var(--read);font-size:13.5px;line-height:1.6}
.defs .ex{color:var(--muted);font-style:italic;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:3px 10px;border:1px solid var(--line2);border-radius:999px;font-size:11.5px;font-family:var(--read)}
.chips button:hover{border-color:var(--inv);color:var(--inv)}

/* popover tra nhanh */
.pop{position:fixed;z-index:60;width:320px;max-width:calc(100vw - 20px);background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:0 20px 40px -18px rgba(80,20,50,.45);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.pop .pw{font-family:var(--read);font-size:18px;font-weight:700}
.pop .pd{font-family:var(--read);line-height:1.55;color:var(--ink2)}
.selbar{position:fixed;z-index:61;display:flex;gap:4px;background:var(--ink);color:var(--surface);border-radius:10px;padding:4px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.selbar button{color:inherit;padding:4px 9px;border-radius:7px;font-size:11.5px;display:flex;align-items:center;gap:5px}
.selbar button:hover{background:rgba(255,255,255,.15)}
.selbar svg{width:13px;height:13px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(40,15,30,.35);display:grid;place-items:center;z-index:80;padding:16px;backdrop-filter:blur(2px)}
.modal .box{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal h3{font-size:16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:12px;z-index:90;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);animation:tin .25s}
.toast .bbm{width:24px;height:24px}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:11px;color:var(--muted);font-weight:600;background:var(--sunk)}
.tbl td.n{font-variant-numeric:tabular-nums;text-align:center}
.tbl tr:hover td{background:var(--sunk)}

/* lộ trình */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.week{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.week.now{border-color:var(--inv);box-shadow:var(--shadow)}
.week .wh{display:flex;align-items:center;gap:8px}
.week .wn{font-size:11px;font-weight:700;color:#fff;background:var(--ac);border-radius:7px;padding:2px 8px}
.week ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.week li label{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45;cursor:pointer;padding:3px 4px;border-radius:6px}
.week li label:hover{background:var(--sunk)}
.week li input{margin-top:2px}
.week li.done span{text-decoration:line-through;color:var(--muted)}
.phase{display:flex;gap:10px;align-items:center}
.phase .dot{width:10px;height:10px;border-radius:50%;background:var(--ac)}

.lesson{font-size:13px;line-height:1.7}
.lesson h3{font-size:14px;margin:14px 0 6px;color:var(--ac)}
.lesson .formula{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:12.5px}
.lesson .eg{font-family:var(--read);border-left:3px solid var(--ac);padding:2px 10px;margin:4px 0;color:var(--ink2)}
.lesson .eg i{color:var(--muted);font-style:normal;font-family:var(--mono);font-size:11.5px;display:block}
.lesson .warn{background:color-mix(in srgb,var(--bad) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 25%,var(--line));border-radius:10px;padding:8px 12px;margin:8px 0}
.lesson ul{padding-left:18px;margin:4px 0}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px;text-align:center;color:var(--muted)}
.empty .bbm{width:110px;height:110px}
.chart{width:100%;max-width:720px;height:auto;display:block;margin:0 auto}
.hero .scene{opacity:var(--scene)}
.chart text{font-family:var(--mono)}
.hide{display:none!important}
.mt{margin-top:6px}
.right{margin-left:auto}

/* ---------- bố cục theo kích thước màn hình ----------
   ≥1100px  : thanh bên đầy đủ (iPad xoay ngang, máy tính)
   600–1099 : thanh bên dạng cột icon có nhãn ngắn (iPad xoay dọc, iPad mini, iPad 10.2" ngang)
   <600     : menu trượt (điện thoại)
   Nội dung bên trong co giãn theo bề rộng vùng nội dung (container query), không theo màn hình. */
.app{padding-block:14px;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px))}

/* =====================================================================
   GIAO DIỆN KIỂU APP iPad (html.app-ui) — theo ngôn ngữ thiết kế iPadOS
   ===================================================================== */
html.app-ui{
  --bg:#F2F2F7; --side:#F2F2F7; --surface:#FFFFFF; --sunk:#F2F2F7; --hover:#E5E5EA;
  --ink:#111114; --ink2:#3A3A3F; --muted:#8A8A8E; --line:rgba(60,60,67,.13); --line2:rgba(60,60,67,.22);
  --chip:rgba(118,118,128,.12); --inv:#FF4F8B; --link:#FF4F8B;
  --mono:-apple-system,"SF Pro Text","Be Vietnam Pro",system-ui,sans-serif;
  --sans:-apple-system,"SF Pro Text","Be Vietnam Pro",system-ui,sans-serif;
  --read:-apple-system,"SF Pro Text","Be Vietnam Pro",system-ui,sans-serif;
  --shadow:none; --blur:color-mix(in srgb,var(--surface) 78%,transparent);
}
@media (prefers-color-scheme: dark){
  html.app-ui:not([data-theme="light"]):not([data-bb="light"]){
    --bg:#000000; --side:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --hover:#2C2C2E;
    --ink:#FFFFFF; --ink2:#E5E5EA; --muted:#8E8E93; --line:rgba(84,84,88,.45); --line2:rgba(84,84,88,.65);
    --chip:rgba(118,118,128,.24); --inv:#FF5C93; --blur:rgba(28,28,30,.78);
  }
}
html.app-ui[data-theme="dark"]:not([data-bb="light"]),html.app-ui[data-bb="dark"]{
  --bg:#000000; --side:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --hover:#2C2C2E;
  --ink:#FFFFFF; --ink2:#E5E5EA; --muted:#8E8E93; --line:rgba(84,84,88,.45); --line2:rgba(84,84,88,.65);
  --chip:rgba(118,118,128,.24); --inv:#FF5C93; --blur:rgba(28,28,30,.78);
}
html.app-ui body{font-size:15px;line-height:1.45;letter-spacing:-.005em}
html.app-ui .app,html.app-ui .app.collapsed{grid-template-columns:300px minmax(0,1fr)!important;padding:0!important;gap:0!important}
html.app-ui .side{position:static!important;transform:none!important;width:auto!important;border-radius:0;border:0;border-right:.5px solid var(--line2);background:var(--side);box-shadow:none;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
html.app-ui .main{border:0;border-radius:0;background:var(--bg)}
html.app-ui .menubtn,html.app-ui .back,html.app-ui .pagehead .ph-ic,html.app-ui .app.menu::before{display:none!important}
html.app-ui.tabmode .app{grid-template-columns:minmax(0,1fr)!important}
html.app-ui.tabmode .side{display:none!important}

/* thanh bên */
.iside{display:flex;flex-direction:column;height:100%;min-height:0;padding:14px 12px 12px}

/* thanh điều hướng */
html.app-ui .topbar{position:relative;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;padding:4px max(16px, env(safe-area-inset-right, 0px)) 4px max(12px, env(safe-area-inset-left, 0px));background:var(--bg);border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
html.app-ui .topbar.scrolled,html.app-ui .topbar.always{background:var(--blur);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--line2)}

/* danh sách nhóm kiểu Cài đặt */
.igroup{display:flex;flex-direction:column}

.lessonwrap{display:flex;flex-direction:column;gap:16px;max-width:860px;width:100%}
.lessonwrap .lesson{font-size:14px}
/* đáp án chia cột khi đủ rộng, gọn và cân đối thay vì một hàng dài trải ngang */
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
/* chỉ chia 2×2 khi có đúng 4 đáp án và nằm trong khung đủ rộng (bài ngữ pháp, trắc nghiệm từ vựng) */
@container main (min-width:600px){
  .lessonwrap .opts:has(>.opt:nth-child(4):last-child),.vquiz .opts:has(>.opt:nth-child(4):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- màu nhấn dịu hơn, bớt mảng hồng đặc ---------- */
.c-M{--ac:#6C7BEA}.c-N{--ac:#8E8E93}
:root{--inv:#EE7AA2; --cV:#EE7AA2; --link:#D9628C; --shadow:0 6px 16px -12px rgba(230,100,150,.45)}

@media (prefers-color-scheme: dark){html.app-ui:not([data-theme="light"]):not([data-bb="light"]){--inv:#F08DB0}}
html.app-ui[data-theme="dark"]:not([data-bb="light"]),html.app-ui[data-bb="dark"]{--inv:#F08DB0}
/* mục đang chọn: nền nhạt + chữ đậm, không tô hồng đặc */

.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn.pri{box-shadow:none}
/* thẻ & nền nhấn nhạt hơn */
.result{background:color-mix(in srgb,var(--ac) 6%,var(--surface));border-color:color-mix(in srgb,var(--ac) 18%,var(--line))}
.tile .pic{background:color-mix(in srgb,var(--ac) 7%,var(--surface))}
.eyebrow{color:color-mix(in srgb,var(--inv) 85%,var(--ink))}
html.app-ui .result{background:var(--surface)}
html.app-ui .btn{background:color-mix(in srgb,var(--inv) 11%,transparent)}

.gearbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}

/* bỏ thanh trên cùng ở kiểu app */
html.app-ui .topbar{display:none}
html.app-ui .content{padding-top:max(18px, env(safe-area-inset-top, 0px))}
.inback{display:inline-flex;align-items:center;gap:2px;color:var(--inv);font-size:16px;font-weight:500;padding:4px 8px 4px 0;margin:0 0 -16px -6px;align-self:flex-start}

/* thu gọn thanh bên */
.sidetog{margin-left:auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--inv)}

.sidetog svg,.sidefab svg{width:22px;height:22px}
.ibrand b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

html.side-off .app{grid-template-columns:minmax(0,1fr)!important}
html.side-off .side{display:none!important}

html.side-off .content{padding-left:max(68px, env(safe-area-inset-left, 0px))}

/* nhập bài đọc */
.impform{display:flex;flex-direction:column;gap:8px}
.impform .lbl{font-size:13px;font-weight:600;margin-top:6px}

/* thanh bên vừa khít chiều cao màn hình, không cần cuộn */

.iscroll{scrollbar-width:none}

</style>
</head>

<script>
/* Linh vật Bánh Bao: SVG, nhiều biểu cảm. mood: happy | study | wow | sleepy | cheer | think */
function bbMascot(mood = "happy", opts = {}) {
  const id = "bb" + Math.random().toString(36).slice(2, 7);
  const bg = opts.bg === false ? "" : `<circle cx="100" cy="100" r="96" fill="${opts.bg || "#FFE3EC"}"/>`;
  const eyes = {
    happy: `<ellipse cx="78" cy="118" rx="8" ry="10" fill="#1d1d1f"/><ellipse cx="122" cy="118" rx="8" ry="10" fill="#1d1d1f"/>

            <circle cx="80" cy="115" r="2.5" fill="#fff"/><circle cx="124" cy="115" r="2.5" fill="#fff"/>
            <circle cx="78" cy="118" r="15" fill="none" stroke="#1d1d1f" stroke-width="3.2"/><circle cx="122" cy="118" r="15" fill="none" stroke="#1d1d1f" stroke-width="3.2"/>
            <path d="M93 117 Q100 112 107 117" fill="none" stroke="#1d1d1f" stroke-width="3.2" stroke-linecap="round"/>`,
    wow: `<ellipse cx="78" cy="116" rx="9" ry="12" fill="#1d1d1f"/><ellipse cx="122" cy="116" rx="9" ry="12" fill="#1d1d1f"/>
          <circle cx="81" cy="111" r="3.5" fill="#fff"/><circle cx="125" cy="111" r="3.5" fill="#fff"/><circle cx="76" cy="121" r="1.6" fill="#fff"/><circle cx="120" cy="121" r="1.6" fill="#fff"/>`,
    sleepy: `<path d="M69 119 Q78 125 87 119" fill="none" stroke="#1d1d1f" stroke-width="3.6" stroke-linecap="round"/>
             <path d="M113 119 Q122 125 131 119" fill="none" stroke="#1d1d1f" stroke-width="3.6" stroke-linecap="round"/>`,
    cheer: `<path d="M69 121 Q78 109 87 121" fill="none" stroke="#1d1d1f" stroke-width="3.8" stroke-linecap="round"/>
            <path d="M113 121 Q122 109 131 121" fill="none" stroke="#1d1d1f" stroke-width="3.8" stroke-linecap="round"/>`,

            <circle cx="83" cy="112" r="2.8" fill="#fff"/><circle cx="127" cy="112" r="2.8" fill="#fff"/>`
  }[mood] || "";
  const mouth = {
    happy: `<path d="M93 133 Q100 140 107 133" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>`,
    study: `<path d="M95 136 Q100 139 105 136" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>`,
    wow: `<ellipse cx="100" cy="138" rx="5" ry="6" fill="#1d1d1f"/><ellipse cx="100" cy="140.5" rx="3" ry="2.4" fill="#FF7FA2"/>`,
    sleepy: `<path d="M95 136 Q100 139 105 136" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>`,
    cheer: `<path d="M91 131 Q100 146 109 131 Z" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="2" stroke-linejoin="round"/><path d="M95 138 Q100 143 105 138" fill="#FF7FA2"/>`,
    think: `<path d="M94 136 L106 134" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>`
  }[mood] || "";
  const extra = {
    sleepy: `<text x="146" y="62" font-family="Arial Rounded MT Bold,Arial" font-weight="700" font-size="20" fill="#9AA7C7">z</text><text x="160" y="46" font-family="Arial" font-weight="700" font-size="14" fill="#9AA7C7">z</text>`,

  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="bbm" aria-hidden="true">

    ["A", "Coffee is one of the most popular drinks in the world, with billions of cups drunk every day. Yet nobody knows exactly where or when people first discovered it. According to a popular legend, a goat herder in Ethiopia noticed that his goats became full of energy after eating red berries from a certain bush. He tried the berries himself and felt the same effect. Although this story is probably not true, most historians agree that the coffee plant did originally grow in Ethiopia."],
    ["B", "What is certain is that by the fifteenth century, coffee was being grown and drunk in Yemen, on the other side of the Red Sea. Religious men there drank it to stay awake during long night prayers. From Yemen, the drink spread to Egypt, Persia and Turkey, where the first public coffee houses opened. These became important places where people met to talk, listen to music and play games."],
    ["C", "In the seventeenth century, coffee arrived in Europe. At first some people were suspicious of the dark, bitter drink, but it soon became fashionable. In London, coffee houses were sometimes called \"penny universities\", because for the price of a cup of coffee, a customer could sit for hours listening to discussions about politics, science and business."],
    ["D", "Coffee came to Vietnam much later. It was introduced by French missionaries in the second half of the nineteenth century, and the French later created large plantations in the Central Highlands, where the climate and the red volcanic soil were ideal. Today, Vietnam is the second largest coffee producer in the world after Brazil. Most of the coffee it grows is robusta, a type that is stronger and more bitter than arabica, the variety preferred in many Western countries."],
    ["E", "Vietnamese people have also created their own ways of enjoying coffee. The traditional method uses a small metal filter called a phin, which sits on top of the cup and lets the coffee drip through slowly. Because fresh milk was hard to find in the past, people began to add sweetened condensed milk instead, creating the famous cà phê sữa. Perhaps the most unusual invention is egg coffee, which is said to have been created in Hanoi in the 1940s by a hotel bartender who used whisked egg yolk as a replacement for milk."]
  ],
  groups: [
    { type: "tfng", instr: "Do the following statements agree with the information in the passage? Choose <b>TRUE</b>, <b>FALSE</b> or <b>NOT GIVEN</b>.", qs: [
      { q: "Historians believe the story about the Ethiopian goat herder is completely accurate.", a: "FALSE", ex: "Đoạn A: “this story is probably not true” → bài nói ngược lại, nên FALSE." },
      { q: "In Yemen, coffee helped religious men stay awake at night.", a: "TRUE", ex: "Đoạn B: “drank it to stay awake during long night prayers”." },
      { q: "The first coffee houses in Turkey were more popular than those in Egypt.", a: "NOT GIVEN", ex: "Đoạn B chỉ nói coffee houses mở ở Turkey, không so sánh với Egypt → NOT GIVEN." },
      { q: "Everyone in Europe liked coffee as soon as it arrived.", a: "FALSE", ex: "Đoạn C: “At first some people were suspicious” → không phải ai cũng thích ngay." },
      { q: "Vietnam produces more coffee than Brazil.", a: "FALSE", ex: "Đoạn D: Việt Nam đứng thứ hai “after Brazil” → Brazil nhiều hơn." }
    ]},
    { type: "mcq", instr: "Choose the correct letter, <b>A, B, C or D</b>.", qs: [
      { q: "Why were London coffee houses called “penny universities”?", opts: ["Students studied there after class", "Customers could learn from discussions for the price of a coffee", "Universities were built next to them", "Coffee cost one penny for students only"], a: 1, ex: "Đoạn C: trả tiền một cốc cà phê là được ngồi nghe bàn luận về chính trị, khoa học → như “đại học một xu”." },
      { q: "Robusta coffee is described as", opts: ["milder than arabica", "the type most Western countries prefer", "stronger and more bitter than arabica", "grown mainly in Brazil"], a: 2, ex: "Đoạn D: robusta “stronger and more bitter than arabica”." }
    ]},
    { type: "gap", instr: "Complete the sentences. Choose <b>ONE WORD ONLY</b> from the passage for each answer.", qs: [
      { q: "The coffee plantations in the Central Highlands benefited from the red volcanic ___.", a: ["soil"], ex: "Đoạn D: “the red volcanic soil were ideal”." },
      { q: "The traditional Vietnamese coffee filter is called a ___.", a: ["phin"], ex: "Đoạn E: “a small metal filter called a phin”." },
      { q: "Egg coffee was first made by a hotel ___ in Hanoi.", a: ["bartender"], ex: "Đoạn E: “created in Hanoi in the 1940s by a hotel bartender”." }
    ]}
  ]

{
  id: "r-bicycle", title: "The Return of the Bicycle", level: "Band 5.0–5.5", topic: "Cities · Transport", minutes: 20,
  desc: "Vì sao xe đạp quay lại thành phố châu Âu. Có dạng chọn tiêu đề đoạn. 13 câu.",
  paras: [
    ["A", "In the 1950s, bicycles were the most common form of transport in many European and Asian cities. In Amsterdam, for example, around 80 percent of all journeys were made by bike. However, as people became richer in the following decades, they began to buy cars, and city planners built wide roads to make room for them. By the early 1970s, cycling in many cities had fallen to less than a quarter of its former level, and streets that had once been full of bicycles were crowded with traffic."],
    ["B", "The change did not come without a price. As the number of cars increased, so did the number of road accidents. In the Netherlands alone, more than 3,000 people were killed on the roads in 1971, and over 400 of them were children. Parents began to organise protests, and one movement, called \"Stop the Child Murder\", attracted thousands of supporters. At the same time, the oil crisis of 1973 made petrol suddenly expensive, and the government introduced car-free Sundays in order to save fuel. For many people, these quiet Sundays were the first time they had seen their streets without cars."],
    ["C", "These events persuaded Dutch politicians to rethink their transport policy. Instead of building more roads, cities started to invest in separate cycle lanes, protected from traffic by kerbs or low walls. Traffic lights were changed so that cyclists could cross junctions safely, and large parking areas for bicycles were built next to railway stations. Today, the Netherlands has more than 35,000 kilometres of cycle paths, and there are more bicycles in the country than people."],
    ["D", "Other cities have learned from this experience. Copenhagen, the capital of Denmark, set a target that half of all trips to work or school should be made by bicycle, and it now comes close to reaching it. In Paris, the city government has closed several busy roads along the River Seine to cars and turned them into spaces for walking and cycling. Bike-sharing schemes, in which people can rent a bicycle for a short trip using a smartphone app, have spread from Europe to Asian cities such as Hangzhou and Taipei."],
    ["E", "Supporters of cycling point to a long list of benefits. Cycling produces no air pollution and very little noise, and it takes up far less space than driving: one car parking space can hold up to ten bicycles. Regular cyclists also tend to be healthier. One British study, which followed more than 250,000 people for five years, found that those who cycled to work had a much lower risk of heart disease than those who drove or took public transport."],
    ["F", "Nevertheless, persuading people to leave their cars at home is not easy. In hot or rainy climates, many people find cycling uncomfortable, and in cities with long distances between home and work, it may simply be impractical. Some experts believe that electric bicycles could solve part of this problem. Because the rider receives help from a small motor, e-bikes make it possible to travel longer distances and climb hills without arriving at work tired. Sales of e-bikes in Europe have grown rapidly, and in some countries they now outsell ordinary bicycles."]
  ],
  groups: [
    { type: "match", instr: "The passage has six paragraphs, A–F. Choose the correct heading for paragraphs <b>B–E</b> from the list of headings below.", options: [
      "i. A dangerous time leads to public anger", "ii. The health risks of cycling", "iii. A new approach to transport planning", "iv. Ideas spread to other places", "v. The advantages of riding a bike", "vi. Why people stopped using cars", "vii. The cost of building cycle paths"], qs: [
      { q: "Paragraph B", a: 0, ex: "Đoạn B nói tai nạn tăng, trẻ em chết, phụ huynh biểu tình → “thời kỳ nguy hiểm dẫn tới sự phẫn nộ”. Chú ý: đoạn B có nhắc car-free Sundays nhưng ý chính là tai nạn và phản đối." },
      { q: "Paragraph C", a: 2, ex: "Đoạn C: chính trị gia “rethink their transport policy”, đầu tư làn xe đạp → cách tiếp cận mới. Bẫy: vii (chi phí) – bài không nói chi phí." },
      { q: "Paragraph D", a: 3, ex: "Đoạn D: Copenhagen, Paris, Hangzhou, Taipei học theo → ý tưởng lan sang nơi khác." },
      { q: "Paragraph E", a: 4, ex: "Đoạn E bắt đầu bằng “a long list of benefits” → lợi ích. Bẫy: ii (rủi ro sức khỏe) ngược nghĩa." }
    ]},
    { type: "tfng", instr: "Do the following statements agree with the information in the passage? Choose <b>TRUE</b>, <b>FALSE</b> or <b>NOT GIVEN</b>.", qs: [
      { q: "In the 1950s, most journeys in Amsterdam were made by bicycle.", a: "TRUE", ex: "Đoạn A: “around 80 percent of all journeys were made by bike” → đa số." },
      { q: "The “Stop the Child Murder” movement was started by a politician.", a: "NOT GIVEN", ex: "Đoạn B chỉ nói phụ huynh tổ chức biểu tình và phong trào có hàng nghìn người ủng hộ; không nói ai khởi xướng." },
      { q: "Car-free Sundays were introduced mainly to reduce road accidents.", a: "FALSE", ex: "Đoạn B: car-free Sundays để “save fuel” (tiết kiệm nhiên liệu) chứ không phải giảm tai nạn." },
      { q: "There are fewer bicycles than people in the Netherlands.", a: "FALSE", ex: "Đoạn C: “there are more bicycles in the country than people” → ngược lại." },
      { q: "Copenhagen has completely achieved its target for cycling to work or school.", a: "FALSE", ex: "Đoạn D: “comes close to reaching it” = gần đạt, tức là chưa đạt hoàn toàn." }
    ]},
    { type: "gap", instr: "Complete the sentences. Write <b>ONE WORD AND/OR A NUMBER</b> from the passage for each answer.", qs: [
      { q: "One car parking space has room for up to ___ bicycles.", a: ["ten", "10"], ex: "Đoạn E: “one car parking space can hold up to ten bicycles”." },
      { q: "The British study followed its participants for ___ years.", a: ["five", "5"], ex: "Đoạn E: “followed more than 250,000 people for five years”." },
      { q: "E-bikes have a small ___ that helps the rider.", a: ["motor"], ex: "Đoạn F: “help from a small motor”." },
      { q: "In some countries, e-bikes now outsell ___ bicycles.", a: ["ordinary"], ex: "Đoạn F: “they now outsell ordinary bicycles”. Lưu ý chép đúng từ trong bài." }
    ]}
  ]
},
{
  id: "r-sleep", title: "Why Teenagers Can't Get Up", level: "Band 5.5–6.0", topic: "Health · Education", minutes: 20,
  desc: "Khoa học về giấc ngủ tuổi teen và chuyện cho học sinh vào học muộn hơn. 13 câu.",
  paras: [
    ["A", "Most parents of teenagers have had the same experience: a child who cannot fall asleep before midnight and then cannot get out of bed in the morning. It is easy to see this as laziness, but scientists now believe that the problem is largely biological. During puberty, the body begins to release melatonin, the hormone that makes us feel sleepy, around two hours later than it did in childhood. As a result, a typical 15-year-old does not feel tired until about 11 p.m., even if he or she has been awake since early morning."],
    ["B", "At the same time, the amount of sleep young people need does not fall as much as many people think. Sleep experts recommend that teenagers aged 13 to 18 sleep between eight and ten hours a night. However, surveys in many countries show that most of them get far less. In one large American survey, nearly three-quarters of high school students reported sleeping less than eight hours on school nights."],
    ["C", "Lack of sleep has serious effects. Tired students find it harder to concentrate and to remember new information, because the brain uses sleep to organise and store what it has learned during the day. Poor sleep has also been linked to low mood, anxiety and weight gain. Perhaps most worrying is the effect on safety: young drivers who have slept for fewer than six hours are much more likely to be involved in a car crash."],
    ["D", "Modern technology has made the problem worse. Many teenagers take their phones to bed and continue chatting or watching videos late into the night. The light from screens, particularly blue light, can delay the release of melatonin even further. In addition, messages and notifications keep the brain alert at a time when it should be relaxing. Some researchers suggest that phones should be left outside the bedroom altogether."],
    ["E", "One solution that has attracted attention is simply to start school later. In 2016, a group of schools in Seattle, in the United States, moved their start time from 7.50 a.m. to 8.45 a.m. Researchers who studied the students found that they slept around 34 minutes longer on average, and their grades in biology improved by about 4.5 percent. Fewer students also arrived late or missed class."],
    ["F", "Not everyone supports the idea, however. Changing school times can cause difficulties for parents who need to drop their children off before work, and it may also affect school bus timetables and after-school sports. Critics also argue that teenagers might simply stay up even later. Even so, a growing number of education authorities believe the benefits are worth these costs. In 2019, California became the first American state to pass a law stating that most high schools may not begin classes before 8.30 a.m."]
  ],
  groups: [
    { type: "mcq", instr: "Choose the correct letter, <b>A, B, C or D</b>.", qs: [
      { q: "According to paragraph A, teenagers find it hard to sleep early because", opts: ["they are naturally lazy", "their bodies produce a sleep hormone later", "they wake up too early in the morning", "they do not feel tired after school"], a: 1, ex: "Đoạn A: melatonin được tiết ra “two hours later” → B. Bẫy A: bài nói “easy to see this as laziness” nhưng thật ra là sinh học." },
      { q: "How much sleep do experts recommend for teenagers?", opts: ["less than eight hours", "six to eight hours", "eight to ten hours", "more than ten hours"], a: 2, ex: "Đoạn B: “between eight and ten hours a night”." },
      { q: "Why does poor sleep affect learning?", opts: ["Students feel too anxious to study", "The brain needs sleep to store information", "Tired students eat more", "Students spend the night on their phones"], a: 1, ex: "Đoạn C: “the brain uses sleep to organise and store what it has learned”." },
      { q: "What was one result of the later start time in Seattle?", opts: ["Students went to bed earlier", "Students slept over half an hour more", "Biology classes became shorter", "More students arrived late"], a: 1, ex: "Đoạn E: ngủ thêm “around 34 minutes” = hơn nửa tiếng (paraphrase!). D sai vì “Fewer students arrived late”." }
    ]},
    { type: "tfng", instr: "Do the following statements agree with the information in the passage? Choose <b>TRUE</b>, <b>FALSE</b> or <b>NOT GIVEN</b>.", qs: [
      { q: "Blue light from screens can make the body release melatonin later.", a: "TRUE", ex: "Đoạn D: “blue light, can delay the release of melatonin”." },
      { q: "Most students in the American survey slept more than eight hours on school nights.", a: "FALSE", ex: "Đoạn B: gần 3/4 ngủ ÍT hơn 8 tiếng → ngược lại." },
      { q: "The Seattle students' results improved in every subject.", a: "NOT GIVEN", ex: "Bài chỉ nhắc môn biology, không nói về các môn khác." },
      { q: "California's law applies to every school in the state.", a: "FALSE", ex: "Đoạn F: luật áp dụng cho “most high schools”, không phải mọi trường." }
    ]},
    { type: "gap", instr: "Complete the sentences. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.", qs: [
      { q: "Young drivers who have slept fewer than six hours are more likely to have a ___.", a: ["car crash", "crash"], ex: "Đoạn C: “involved in a car crash”." },
      { q: "Messages and ___ keep the brain alert at night.", a: ["notifications"], ex: "Đoạn D: “messages and notifications keep the brain alert”." },
      { q: "Some researchers think phones should be kept outside the ___.", a: ["bedroom"], ex: "Đoạn D: “left outside the bedroom altogether”." },
      { q: "Later start times may affect school bus ___.", a: ["timetables"], ex: "Đoạn F: “school bus timetables”. Nhớ giữ số nhiều -s." },
      { q: "Critics argue that teenagers might just ___ even later.", a: ["stay up"], ex: "Đoạn F: “might simply stay up even later”." }
    ]}
  ]
},
{
  id: "r-farm", title: "Farming in the Sky", level: "Band 6.0–6.5", topic: "Environment · Science", minutes: 20,
  desc: "Nông trại thẳng đứng trong thành phố: lợi ích và khó khăn. Có điền tóm tắt. 13 câu.",
  paras: [
    ["A", "By 2050, the world's population is expected to reach nearly ten billion, and around two-thirds of these people will live in cities. Feeding them will be one of the greatest challenges of the century. Traditional agriculture already uses about half of the planet's habitable land, and much of the remaining land is either too dry, too cold or too valuable to be turned into farms. This has led some scientists and businesspeople to ask a surprising question: instead of growing food outwards, across fields, why not grow it upwards, inside buildings?"],
    ["B", "The idea, known as vertical farming, was made popular in the late 1990s by Dickson Despommier, a professor at Columbia University in New York. He and his students imagined skyscrapers in which every floor was used to grow crops. In a modern vertical farm, plants are grown in trays stacked on top of each other, often in a disused warehouse rather than a skyscraper. Instead of soil, the roots sit in water containing nutrients, a method called hydroponics, and sunlight is replaced by LED lamps that can be adjusted to give each type of plant exactly the colour and amount of light it needs."],
    ["C", "Supporters claim that this approach has several clear advantages. Because conditions are fully controlled, crops can be grown all year round regardless of the weather, and there is no need for pesticides, since insects cannot get in. Vertical farms also use far less water than conventional farms, because water is recycled within the system; some companies claim savings of up to 95 percent. Most importantly, perhaps, the farms can be built in the middle of cities, close to the people who will eat the food. This reduces the distance that food has to travel and means that vegetables can reach shops within hours of being picked."],
    ["D", "However, the industry has faced serious difficulties. The biggest problem is energy. While the sun provides light to traditional farms for free, vertical farms must pay for the electricity to run their lamps, as well as for heating, cooling and pumps. When energy prices rose sharply in 2022, several well-known vertical farming companies in Europe and the United States were forced to close or cut back. Critics also point out that the range of crops is limited. Leafy greens such as lettuce and herbs grow quickly and are easy to stack, but staple crops like wheat and rice, which provide most of the world's calories, are not commercially worth growing indoors."],
    ["E", "Some researchers believe the solution lies in combining old and new methods. In Singapore, a small country that imports more than 90 percent of its food, the government has encouraged farms on the roofs of car parks and office buildings, where natural sunlight can be used alongside artificial light. Elsewhere, engineers are experimenting with solar panels and more efficient lamps in order to cut energy costs."],
    ["F", "It is unlikely that vertical farms will ever replace traditional agriculture. But as cities grow and the climate becomes less predictable, they may become an important part of the food system, supplying fresh, local produce to urban populations. The aim, most experts agree, is not to replace farmers, but to give cities one more way of feeding themselves."]
  ],
  groups: [
    { type: "mcq", instr: "Choose the correct letter, <b>A, B, C or D</b>.", qs: [
      { q: "What is the main purpose of paragraph A?", opts: ["to describe the history of farming", "to explain why new ways of producing food are needed", "to compare life in cities and the countryside", "to argue that the population will stop growing"], a: 1, ex: "Đoạn A nêu dân số tăng, đất nông nghiệp có hạn → cần cách sản xuất thực phẩm mới." },
      { q: "In a modern vertical farm, plants usually grow", opts: ["in soil on the roof of a skyscraper", "in water with added nutrients", "in fields next to the city", "under natural sunlight only"], a: 1, ex: "Đoạn B: “Instead of soil, the roots sit in water containing nutrients”." },
      { q: "According to paragraph D, wheat and rice are rarely grown in vertical farms because", opts: ["they need too much water", "they are often attacked by insects", "it is not profitable to grow them indoors", "they grow too quickly"], a: 2, ex: "Đoạn D: “not commercially worth growing indoors” = không có lãi → C." }
    ]},
    { type: "tfng", instr: "Do the following statements agree with the information in the passage? Choose <b>TRUE</b>, <b>FALSE</b> or <b>NOT GIVEN</b>.", qs: [
      { q: "Despommier's original idea was to use every floor of tall buildings for crops.", a: "TRUE", ex: "Đoạn B: “skyscrapers in which every floor was used to grow crops”." },
      { q: "Vertical farms need pesticides to protect their crops.", a: "FALSE", ex: "Đoạn C: “there is no need for pesticides”." },
      { q: "Vegetables from vertical farms are more expensive in shops than those from traditional farms.", a: "NOT GIVEN", ex: "Bài nói chi phí năng lượng cao nhưng không hề so sánh giá bán rau ở cửa hàng." },
      { q: "Rising energy prices caused problems for some vertical farming companies.", a: "TRUE", ex: "Đoạn D: giá năng lượng tăng năm 2022 khiến vài công ty “forced to close or cut back”." },
      { q: "Singapore produces most of the food that it consumes.", a: "FALSE", ex: "Đoạn E: Singapore “imports more than 90 percent of its food” → tự sản xuất rất ít." }
    ]},
    { type: "gap", instr: "Complete the summary. Choose <b>ONE WORD ONLY</b> from the passage for each answer.", qs: [
      { q: "Vertical farms grow plants in water instead of soil, a technique called ___.", a: ["hydroponics"], ex: "Đoạn B: “a method called hydroponics”." },
      { q: "Instead of sunlight, they use ___ lamps.", a: ["LED"], ex: "Đoạn B: “sunlight is replaced by LED lamps”." },
      { q: "Because the farms are in cities, food does not have to ___ very far.", a: ["travel"], ex: "Đoạn C: “reduces the distance that food has to travel”." },
      { q: "The cost of ___ is the industry's biggest problem.", a: ["energy", "electricity"], ex: "Đoạn D: “The biggest problem is energy” (electricity cũng chấp nhận vì cùng ý)." },
      { q: "In Singapore, farms have been built on the ___ of car parks and offices.", a: ["roofs"], ex: "Đoạn E: “farms on the roofs of car parks and office buildings”." }
    ]}
  ]
}
];

    ["L", "Good afternoon. Today I'm going to talk about a problem that affects almost every large city in the world: the urban heat island effect. Put simply, this is when a city is significantly warmer than the countryside around it. Interestingly, the difference is usually greatest not during the day, but at night."],
    ["L", "So why does this happen? There are three main causes. The first is the materials that cities are built from. Concrete and asphalt absorb heat from the sun during the day and then release it slowly at night. Dark surfaces, such as roads and roofs, are particularly bad, because they reflect very little sunlight."],

    sample: "The person I'd like to talk about is my English teacher in high school, Ms Lan. She taught me for three years, from grade ten to grade twelve. Before I met her, I was actually quite bad at English and I didn't enjoy it at all, because I thought it was just about grammar rules and boring exercises. But Ms Lan changed that completely. Her lessons were always fun and interactive. She used songs, short videos and games, and she always encouraged us to speak, even if we made mistakes. I remember one time I was too shy to answer a question, and after class she told me that making mistakes is the only way to learn. That really stuck with me. Thanks to her, I started watching films in English and practising with friends, and my scores improved a lot. More importantly, she taught me to believe in myself. Now, whenever I face something difficult, I remember her advice. She's definitely one of my role models, and I wouldn't be studying for IELTS today without her.",

  { id: "s-place", kind: "Place", title: "Describe a place you visited that you really liked.", vi: "Tả một nơi bạn từng đến và rất thích",
    cue: ["where it is", "when you went there", "what you did there", "and explain why you liked it so much"],
    vocab: ["breathtaking scenery", "off the beaten track", "unwind", "local cuisine", "crystal-clear water", "a once-in-a-lifetime experience"],
    sample: "I'd like to talk about Phu Quoc, an island in the south of Vietnam. I went there with my family last summer, right after my final exams, so it was a kind of reward for all my hard work. We stayed there for four days in a small resort near the beach. During the day, we went swimming and snorkelling, and the water was crystal-clear, so we could see lots of colourful fish. One day we also took a boat trip to some smaller islands nearby, which was amazing. In the evenings we went to the night market and tried all kinds of local seafood, like grilled squid and sea urchins. I liked this place so much for a few reasons. First, the scenery was breathtaking, especially the sunsets. Second, it was the first time in a long time that my whole family travelled together, so we had a lot of fun and made great memories. And finally, it was so peaceful that I could completely unwind after a stressful exam period. I'd love to go back there one day.",
    p3: ["Why do people like to travel to new places?", "What are the effects of tourism on local communities?", "Do you think people travel more now than in the past?", "Should famous tourist sites limit the number of visitors?"] },
  { id: "s-object", kind: "Object", title: "Describe something you own that is important to you.", vi: "Tả một món đồ quan trọng với bạn",
    cue: ["what it is", "how you got it", "how often you use it", "and explain why it is important to you"],
    vocab: ["sentimental value", "a gift from", "carry it everywhere", "remind me of", "irreplaceable", "come in handy"],
    sample: "The thing I want to talk about is a small silver bracelet that my grandmother gave me on my eighteenth birthday. It's quite simple, with a little heart-shaped charm, but it means a lot to me. My grandmother told me she had bought it when she was young, and she wanted me to have it because I'm her only granddaughter. I wear it almost every day, especially when I have something important to do, like an exam or a job interview. I know it sounds a bit silly, but it makes me feel lucky and more confident. The main reason it's important to me is its sentimental value. My grandmother lives in the countryside, so I can't visit her very often, and whenever I look at the bracelet, it reminds me of her and the time we spent together when I was a child. It's not expensive at all, but for me it's completely irreplaceable. If I lost it, I would be heartbroken.",
    p3: ["Why do people like to keep old things?", "Do you think people today buy too many things?", "What kinds of gifts are popular in your country?", "Is it better to give money or a present as a gift?"] },
  { id: "s-event", kind: "Event", title: "Describe a time when you felt proud of yourself.", vi: "Tả lần bạn cảm thấy tự hào về bản thân",
    cue: ["when it happened", "what you did", "who you were with", "and explain why you felt proud"],
    vocab: ["achieve", "put in a lot of effort", "nervous", "pay off", "a sense of achievement", "over the moon"],
    sample: "I'd like to talk about the time I won second prize in a school English speaking contest when I was in grade eleven. To be honest, I almost didn't take part, because I was very shy and my speaking wasn't very good. But my best friend encouraged me to sign up, so I decided to give it a try. For about a month, I practised every evening. I recorded myself, listened back, and asked my teacher to correct my pronunciation. On the day of the contest, I was so nervous that my hands were shaking, but once I started speaking, I felt more relaxed. My talk was about protecting the environment, and the judges said they liked my ideas and my confidence. When they announced that I had won second prize, I was over the moon. I felt proud not just because of the prize, but because I had overcome my fear of speaking in public. It showed me that hard work really pays off, and that experience is one of the reasons I'm not afraid of the IELTS speaking test now.",
    p3: ["Is it important for parents to praise their children?", "What achievements are most valued in your society?", "Do you think competition is good for students?", "Is success more about hard work or talent?"] },
  { id: "s-skill", kind: "Activity", title: "Describe a skill you would like to learn.", vi: "Tả một kỹ năng bạn muốn học",
    cue: ["what the skill is", "how you would learn it", "how difficult you think it would be", "and explain why you want to learn it"],
    vocab: ["pick up", "from scratch", "online tutorials", "time-consuming", "a valuable skill", "practise regularly"],
    sample: "One skill I'd really love to learn is swimming properly. It might sound surprising, but even though I'm an adult, I can only swim a few metres, and I always feel a bit scared in deep water. I think the best way to learn would be to take lessons with a professional coach at a swimming pool near my house. They offer evening classes for adults, so I could go after school two or three times a week. I also might watch some online tutorials to understand the techniques. I think it would be quite difficult at first, mainly because I'd need to overcome my fear and learn to breathe correctly. But I believe that if I practise regularly, I could pick it up in a few months. There are several reasons why I want to learn it. First, it's an important life skill, especially in Vietnam, where there are so many rivers and beaches. Second, swimming is a great form of exercise. And finally, I'd love to go snorkelling on holiday without feeling nervous.",
    p3: ["What skills should children learn at school?", "Is it better to learn a skill from a teacher or by yourself online?", "Which is more important: practical skills or academic knowledge?", "Why do some adults find it hard to learn new skills?"] },
  { id: "s-book", kind: "Media", title: "Describe a book, film or TV series you enjoyed.", vi: "Tả một cuốn sách / phim bạn thích",
    cue: ["what it was", "when you read or watched it", "what it was about", "and explain why you enjoyed it"],
    vocab: ["the plot", "the main character", "gripping", "heart-warming", "a plot twist", "highly recommend"],
    sample: "I'd like to talk about a Korean TV series called Reply 1988, which I watched during my summer holiday a couple of years ago. One of my friends recommended it, and once I started, I couldn't stop. I think I finished all twenty episodes in about two weeks. The series is about five teenage friends and their families who live in the same neighbourhood in Seoul in the late 1980s. It shows their everyday lives, their friendships, their first loves and the problems they face at school and at home. There isn't a lot of action, but the story is really heart-warming and funny. There are a few reasons why I enjoyed it so much. First, the characters felt very real, and I could relate to them, especially the main character, who often feels overlooked by her family. Second, it made me appreciate my own family and friends more. And finally, it has a really nice soundtrack. I'd highly recommend it to anyone who likes slow, emotional stories.",
    p3: ["Do young people read fewer books than in the past?", "Are films based on books usually better or worse than the books?", "What can people learn from watching TV or films?", "Should the government control what is shown on TV?"] },
  { id: "s-help", kind: "Experience", title: "Describe a time when you helped someone.", vi: "Tả lần bạn giúp đỡ người khác",
    cue: ["who you helped", "how you helped them", "why you helped them", "and explain how you felt about it"],
    vocab: ["lend a hand", "struggling with", "volunteer", "grateful", "make a difference", "it was the least I could do"],
    sample: "I'd like to talk about a time when I helped a foreign tourist who was lost in the city centre. It happened last year, when I was walking near Ben Thanh Market. I noticed an elderly woman looking at her phone and seeming really confused. She was trying to find her hotel, but her phone had run out of battery and she couldn't speak any Vietnamese. So I went up to her and asked if she needed help. She told me the name of her hotel, and luckily I knew where it was, because it was only about ten minutes away. Instead of just giving directions, I decided to walk there with her, because the streets were really busy and crossing the road can be scary for visitors. On the way, we chatted about her trip and she told me she was from Australia. When we arrived, she was really grateful and gave me a big hug. I felt very happy afterwards, partly because I could help someone, and partly because I realised that my English was good enough to have a real conversation. It was a small thing, but it made my day.",
    p3: ["Do people help each other less in big cities than in small towns?", "Should schools encourage students to do volunteer work?", "Why do some people not like asking for help?", "How can governments encourage people to help their communities?"] },
  { id: "s-tech", kind: "Technology", title: "Describe a piece of technology you find useful.", vi: "Tả một thiết bị/công nghệ hữu ích với bạn",
    cue: ["what it is", "when you started using it", "how you use it", "and explain why you find it useful"],
    vocab: ["user-friendly", "save time", "can't imagine life without", "keep track of", "handy", "notifications"],
    sample: "The piece of technology I find most useful is my laptop. My parents bought it for me when I started university, so I've had it for about two years now. It's quite light, so I can carry it everywhere in my backpack. I use it for almost everything. For my studies, I use it to take notes in class, write assignments and attend online lectures. I also use it to practise for IELTS, for example by doing listening tests and writing essays. In my free time, I watch films, listen to music and video call my cousins who live abroad. The main reason I find it so useful is that it saves me a lot of time. Instead of going to the library to look for information, I can find almost anything online in a few seconds. It also helps me stay organised, because I keep track of all my deadlines with a calendar app. Honestly, I can't imagine studying without it.",
    p3: ["How has technology changed the way people study?", "Do you think people depend too much on technology?", "Should children be allowed to use smartphones?", "What technology do you think will be important in the future?"] }
],
tips: [
  { h: "Công thức trả lời Part 1: A + R + E", b: "<p>Mỗi câu trả lời khoảng 2–3 câu (15–25 giây):</p><ul><li><b>A</b>nswer – trả lời thẳng: <i>Yes, I do. / I'd say…</i></li><li><b>R</b>eason – lý do: <i>because… / mainly because…</i></li><li><b>E</b>xample – ví dụ nhỏ từ đời sống: <i>For example, last weekend…</i></li></ul><div class=\"warn\">Đừng chỉ trả lời “Yes” hay “No”. Cũng đừng học thuộc câu mẫu nguyên văn: giám khảo nhận ra ngay và trừ điểm.</div>" },
  { h: "Part 2: tận dụng 1 phút chuẩn bị", b: "<p>Ghi 4–6 <b>từ khóa</b> theo từng gạch đầu dòng, không viết câu. Bắt đầu bằng câu dẫn: <i>I'd like to talk about…</i>. Dành thời gian nhiều nhất cho dòng cuối (<i>explain why…</i>) vì đó là phần cho thấy khả năng mở rộng ý. Nếu hết ý trước 2 phút, kể thêm một chi tiết, cảm xúc hoặc so sánh quá khứ – hiện tại.</p>" },
  { h: "Part 3: trả lời như thảo luận", b: "<p>Câu hỏi trừu tượng hơn, về xã hội nói chung. Dùng khung: <b>quan điểm → giải thích → ví dụ → (so sánh/điều kiện)</b>.</p><ul><li><i>I think it depends on… / From my point of view, …</i></li><li><i>One reason is that… Another factor is…</i></li><li><i>For instance, in Vietnam…</i></li><li><i>If the government…, then…</i></li></ul>" },
  { h: "Khi bí ý hoặc quên từ", b: "<p>Dùng câu “mua thời gian” tự nhiên thay cho “um… uh…”:</p><ul><li><i>That's an interesting question. Let me think…</i></li><li><i>I've never really thought about that before, but I guess…</i></li><li><i>I'm not sure what it's called in English, but it's a kind of…</i> (diễn giải thay vì im lặng)</li></ul>" },
  { h: "Phát âm: 3 lỗi người Việt hay gặp", b: "<ul><li><b>Âm cuối</b>: bỏ âm /s/, /t/, /d/, /k/ (<i>like, books, worked</i>). Hãy bật rõ âm cuối.</li><li><b>Đuôi -ed</b>: /t/ sau âm vô thanh (<i>watched</i>), /d/ sau âm hữu thanh (<i>played</i>), /ɪd/ sau t, d (<i>wanted</i>).</li><li><b>Trọng âm từ</b>: <i>PHOtograph – phoTOgraphy – photoGRAphic</i>. Tra trọng âm ở trang Tra từ.</li></ul><p>Mẹo: ghi âm bằng tab Part 1/2 rồi xem máy chép lại. Từ nào máy nghe sai là từ cần luyện.</p>" }
]
};
