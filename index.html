const GRAMMAR = [
{ id: "g-tense", title: "Hiện tại hoàn thành vs Quá khứ đơn", vi: "Hai thì hay bị nhầm nhất trong Speaking và Writing", use: "Speaking · Task 1",
  body: `<h3>Quá khứ đơn (Past simple)</h3><p>Dùng cho hành động <b>đã xong</b>, ở <b>thời điểm xác định</b> trong quá khứ.</p>
  <div class="formula">S + V-ed / V2 &nbsp;·&nbsp; dấu hiệu: yesterday, last year, in 2010, … ago</div>
  <div class="eg">The number of visitors <b>rose</b> to 230,000 <b>in 2018</b>.<i>Task 1 có năm cụ thể trong quá khứ → luôn dùng quá khứ đơn.</i></div>
  <h3>Hiện tại hoàn thành (Present perfect)</h3><p>Dùng khi hành động <b>bắt đầu trong quá khứ và còn kéo dài</b> đến nay, hoặc <b>không nói rõ thời điểm</b>.</p>
  <div class="formula">S + have/has + V3 &nbsp;·&nbsp; dấu hiệu: since, for, ever, never, recently, so far</div>
  <div class="eg">I <b>have lived</b> in Ho Chi Minh City <b>for</b> five years.<i>Vẫn đang sống ở đó.</i></div>
  <div class="eg">My hometown <b>has changed</b> a lot in recent years.</div>
  <div class="warn">Sai: <s>I have visited Da Lat last summer.</s> → có “last summer” nên dùng <b>I visited</b>.</div>`,
  ex: [
    { q: "I ___ English for six years, and I still enjoy it.", opts: ["learn", "learned", "have learned", "am learning"], a: 2, ex: "“for six years” và vẫn còn học → hiện tại hoàn thành." },
    { q: "The percentage of households with internet access ___ sharply in 2015.", opts: ["has risen", "rose", "rises", "have risen"], a: 1, ex: "Có năm cụ thể 2015 → quá khứ đơn." },
    { q: "Have you ever ___ to another country?", opts: ["be", "was", "been", "being"], a: 2, ex: "Have + V3 (been)." },
    { q: "We ___ to Phu Quoc two years ago.", opts: ["went", "have gone", "go", "have been going"], a: 0, ex: "“two years ago” → quá khứ đơn." },
    { q: "Since I started university, I ___ (make) many new friends.", a: ["have made", "'ve made"], ex: "“Since …” → hiện tại hoàn thành: have made." },
    { q: "The figure ___ (remain) stable between 2005 and 2010.", a: ["remained"], ex: "Khoảng thời gian đã kết thúc trong quá khứ → remained." }

{ id: "g-compare", title: "So sánh hơn, so sánh nhất, so sánh gấp", vi: "Thiết yếu cho Writing Task 1 và Part 3 Speaking", use: "Task 1",
  body: `<h3>So sánh hơn & nhất</h3>
  <div class="formula">Tính từ ngắn: cheap → cheap<b>er</b> than → the cheap<b>est</b><br>Tính từ dài: popular → <b>more</b> popular than → <b>the most</b> popular<br>Bất quy tắc: good → better → the best · bad → worse → the worst · many/much → more → the most · little → less → the least</div>
  <div class="eg">Social media was <b>more popular</b> among young people <b>than</b> among older people.</div>
  <h3>So sánh gấp & bằng</h3>
  <div class="formula">twice / three times <b>as</b> + adj + <b>as</b> · half as many as · the same as</div>
  <div class="eg">The over-65s watched TV for <b>twice as long as</b> people aged 16–24.</div>
  <h3>Nhấn mạnh mức độ</h3><p>Thêm <b>much / far / significantly / slightly</b> trước so sánh hơn: <i>significantly higher</i>, <i>slightly lower</i>.</p>
  <div class="warn">Sai: <s>more cheaper</s>, <s>the most biggest</s>. Không dùng 2 lần so sánh.</div>`,
  ex: [
    { q: "Public transport is ___ than driving in big cities.", opts: ["more cheap", "cheaper", "cheapest", "more cheaper"], a: 1, ex: "cheap là tính từ ngắn → cheaper." },
    { q: "Science was ___ subject among the students surveyed.", opts: ["the most popular", "most popular", "the more popular", "more popular"], a: 0, ex: "So sánh nhất với tính từ dài: the most popular." },
    { q: "Women spent twice ___ much time on housework as men.", opts: ["so", "than", "as", "more"], a: 2, ex: "twice as much … as." },
    { q: "My English is ___ now than it was last year.", opts: ["gooder", "more good", "better", "best"], a: 2, ex: "good → better (bất quy tắc)." },
    { q: "The number of cars was slightly ___ (high) in 2020 than in 2019.", a: ["higher"], ex: "high → higher." },
    { q: "Living in the city is ___ (expensive) than living in the countryside.", a: ["more expensive"], ex: "Tính từ dài → more expensive." }
  ]},
{ id: "g-relative", title: "Mệnh đề quan hệ (who, which, that, where)", vi: "Cách nhanh nhất để có câu phức, nâng điểm ngữ pháp", use: "Writing · Speaking",
  body: `<p>Mệnh đề quan hệ bổ sung thông tin cho danh từ đứng trước, giúp nối 2 câu đơn thành 1 câu phức.</p>
  <div class="formula">who → người · which → vật · that → người/vật (chỉ dùng khi không có dấu phẩy) · where → nơi chốn · whose → của ai</div>
  <div class="eg">Teachers <b>who</b> use games make lessons more interesting.</div>
  <div class="eg">Da Lat, <b>which</b> is famous for its flowers, attracts many tourists.<i>Có dấu phẩy = thông tin thêm, KHÔNG dùng “that”.</i></div>
  <div class="eg">This is the café <b>where</b> I usually study.</div>
  <h3>Mẹo Writing</h3><p>Ghép 2 câu ngắn: <i>Many students work part-time. They have less time to study.</i> → <i>Many students <b>who</b> work part-time have less time to study.</i></p>
  <div class="warn">Sai: <s>Ho Chi Minh City, that is the largest city…</s> → <b>which</b>. Sai: <s>the man which…</s> → <b>who</b>.</div>`,
  ex: [
    { q: "People ___ exercise regularly tend to be healthier.", opts: ["which", "who", "where", "whose"], a: 1, ex: "Chỉ người → who." },
    { q: "Hoi An, ___ is a UNESCO World Heritage Site, is very popular with tourists.", opts: ["that", "which", "who", "where"], a: 1, ex: "Có dấu phẩy, chỉ vật → which (không dùng that)." },
    { q: "This is the village ___ my grandparents live.", opts: ["which", "where", "who", "whose"], a: 1, ex: "Nơi chốn + mệnh đề đầy đủ (my grandparents live) → where." },
    { q: "I have a friend ___ mother is a famous chef.", opts: ["who", "which", "whose", "that"], a: 2, ex: "“mẹ của bạn ấy” → whose." },
    { q: "The book ___ I bought yesterday is about climate change. (dùng that hoặc which)", a: ["that", "which"], ex: "Chỉ vật, không có dấu phẩy → that / which." },
    { q: "Students ___ live far from school often feel tired. (người)", a: ["who", "that"], ex: "Chỉ người → who (hoặc that)." }

{ id: "g-cond", title: "Câu điều kiện loại 1 và loại 2", vi: "Rất hữu ích để đưa giải pháp và giả định ở Task 2, Part 3", use: "Task 2 · Part 3",
  body: `<h3>Loại 1 – có thể xảy ra</h3><div class="formula">If + S + V(hiện tại), S + will/can + V</div>
  <div class="eg"><b>If</b> the government <b>invests</b> in public transport, fewer people <b>will use</b> cars.</div>
  <h3>Loại 2 – giả định, khó xảy ra ở hiện tại</h3><div class="formula">If + S + V2/ed (be → were), S + would/could + V</div>
  <div class="eg"><b>If</b> I <b>had</b> more free time, I <b>would learn</b> to swim.</div>
  <div class="eg"><b>If</b> I <b>were</b> the mayor, I <b>would build</b> more parks.</div>
  <h3>Biến thể hay</h3><p><b>Unless</b> = if … not: <i>Unless we act now, the problem will get worse.</i></p>
  <div class="warn">Sai: <s>If I will have time, I will…</s> → mệnh đề if KHÔNG dùng will.</div>`,
  ex: [
    { q: "If people ___ more trees, cities will be cooler.", opts: ["plant", "will plant", "planted", "would plant"], a: 0, ex: "Loại 1: if + hiện tại đơn." },
    { q: "If I ___ a lot of money, I would travel around the world.", opts: ["have", "had", "will have", "would have"], a: 1, ex: "Loại 2: if + quá khứ đơn." },
    { q: "If I were you, I ___ practise speaking every day.", opts: ["will", "would", "am", "did"], a: 1, ex: "If I were you → would (lời khuyên)." },
    { q: "___ students get enough sleep, they will not concentrate in class.", opts: ["If", "Unless", "When", "Because"], a: 1, ex: "Unless = if … not." },
    { q: "If the price of petrol rises, more people ___ (use) public transport.", a: ["will use"], ex: "Loại 1 → will use." },
    { q: "If everyone ___ (recycle) their waste, the environment would be much cleaner.", a: ["recycled"], ex: "Loại 2 → recycled." }
  ]},
{ id: "g-passive", title: "Câu bị động", vi: "Văn phong học thuật, bắt buộc cho dạng Process ở Task 1", use: "Writing",
  body: `<p>Dùng bị động khi <b>hành động quan trọng hơn người làm</b>, hoặc không biết ai làm.</p>
  <div class="formula">S + be (chia theo thì) + V3 (+ by …)</div>

  ex: [
    { q: "English ___ in many countries around the world.", opts: ["speaks", "is spoken", "is speaking", "spoke"], a: 1, ex: "Tiếng Anh được nói → is spoken." },

{ id: "g-article", title: "Mạo từ & danh từ đếm được / không đếm được", vi: "Lỗi nhỏ nhưng mất điểm nhiều nhất của người Việt", use: "Mọi kỹ năng",
  body: `<h3>a / an / the / không mạo từ</h3><ul>
  <li><b>a/an</b>: danh từ đếm được số ít, nhắc lần đầu: <i>a student, an hour</i> (an trước <b>âm</b> nguyên âm).</li>
  <li><b>the</b>: đã xác định / duy nhất: <i>the government, the environment, the Internet</i>.</li>
  <li><b>Không mạo từ</b>: nói chung chung với danh từ số nhiều hoặc không đếm được: <i>Children need love. Technology changes fast.</i></li></ul>
  <h3>Danh từ không đếm được hay gặp trong IELTS</h3>
  <div class="formula">information · advice · knowledge · research · equipment · furniture · traffic · pollution · homework · money · news</div>
  <p>Không thêm -s, không dùng a/an: <i>some advice, a piece of information, much traffic</i>.</p>
  <div class="warn">Sai: <s>informations, an advice, a lot of traffics, a research</s>.<br>Sai: <s>Most of people</s> → <b>Most people</b> hoặc <b>Most of the people</b>.</div>`,

{ id: "g-sva", title: "Hòa hợp chủ ngữ – động từ", vi: "Chia động từ đúng số ít / số nhiều", use: "Writing",
  body: `<p>Chủ ngữ số ít → động từ số ít (thêm -s/es, is, was, has). Chủ ngữ số nhiều → động từ số nhiều.</p>
  <h3>Những trường hợp dễ sai</h3><ul>
  <li><b>The number of</b> + N số nhiều → động từ số <b>ít</b>: <i>The number of tourists <b>has</b> increased.</i></li>
  <li><b>A number of</b> (= many) → động từ số <b>nhiều</b>: <i>A number of students <b>are</b> absent.</i></li>
  <li>Danh động từ (V-ing) làm chủ ngữ → số ít: <i>Reading books <b>is</b> relaxing.</i></li>
  <li>Chủ ngữ dài: tìm danh từ chính: <i>The quality of schools in rural areas <b>is</b> improving.</i></li>
  <li><b>Everyone / everybody / each</b> → số ít: <i>Everyone <b>wants</b> to be happy.</i></li>
  <li>People, children, police → số nhiều.</li></ul>`,
  ex: [
    { q: "The number of students studying abroad ___ increased.", opts: ["have", "has", "are", "were"], a: 1, ex: "The number of … → số ít: has." },
    { q: "A number of people ___ worried about pollution.", opts: ["is", "was", "are", "has"], a: 2, ex: "A number of = many → số nhiều: are." },
    { q: "Learning languages ___ a lot of patience.", opts: ["require", "requires", "are requiring", "have required"], a: 1, ex: "V-ing làm chủ ngữ → số ít." },
    { q: "Children ___ more time outdoors.", opts: ["needs", "need", "is needing", "has needed"], a: 1, ex: "children là số nhiều." },
    { q: "The price of houses in big cities ___ (be) very high.", a: ["is"], ex: "Danh từ chính là price (số ít) → is." },
    { q: "Everyone in my class ___ (have) a smartphone.", a: ["has"], ex: "everyone → số ít: has." }
  ]},

  paras: [
    ["A", "In the 1880s, the German psychologist Hermann Ebbinghaus carried out an unusual experiment on himself. He memorised long lists of nonsense syllables, such as \"WID\" and \"ZOF\", and then tested how many he could remember after different periods of time. His results showed that memory fades very quickly at first: much of the new information was lost within the first day. After that, forgetting slowed down. This pattern became known as the \"forgetting curve\"."],
    ["B", "Ebbinghaus also discovered something more encouraging. When he reviewed the lists again, he needed less time to relearn them, and each review made the memory last longer. Today, this is called the spacing effect: information that is studied several times, with gaps in between, is remembered far better than information studied in one long session. In my view, this is one of the most useful findings in the history of psychology, and yet most students still ignore it, preferring to \"cram\" the night before an exam."],
    ["C", "A second powerful technique is retrieval practice, which simply means testing yourself. In a well-known study published in 2006, two American researchers, Henry Roediger and Jeffrey Karpicke, asked students to read short texts. Some students then re-read the texts, while others wrote down everything they could remember. When they were tested five minutes later, the re-reading group did slightly better. However, one week later, the students who had tested themselves remembered much more."],
    ["D", "Why does testing work so well? One explanation is that the effort of pulling information out of memory strengthens it. Re-reading feels easier and makes learners feel confident, but this confidence can be misleading, because recognising something on the page is not the same as being able to recall it. I believe teachers should therefore give frequent low-pressure quizzes, not to grade students, but to help them learn."],
    ["E", "Sleep also plays an important role. During deep sleep, the brain replays and organises the experiences of the day, moving important information into long-term storage. Students who stay up all night to study may therefore remember less than those who study for a shorter time and get a full night's rest."],
    ["F", "These findings have practical consequences for language learners. Flashcard apps, which show words again just before the learner is likely to forget them, are based directly on the spacing effect. Such tools are not magic, of course: they work only if they are used regularly. But for anyone who needs to learn thousands of words, they are, in my opinion, far more efficient than reading the same vocabulary list again and again."]
  ],
  groups: [
    { type: "mcq", instr: "Choose the correct letter, <b>A, B, C or D</b>.", qs: [
      { q: "What did Ebbinghaus use in his experiment?", opts: ["real words", "nonsense syllables", "pictures", "numbers"], a: 1, ex: "Đoạn A: “lists of nonsense syllables”." },
      { q: "According to the forgetting curve, people", opts: ["forget at the same speed all the time", "forget most quickly soon after learning", "remember more after one day", "stop forgetting after a week"], a: 1, ex: "Đoạn A: “memory fades very quickly at first… After that, forgetting slowed down”." },
      { q: "In the 2006 study, the students who re-read the texts", opts: ["did better on the test after five minutes", "did better on the test after one week", "wrote down what they remembered", "did not take any test"], a: 0, ex: "Đoạn C: sau 5 phút, nhóm đọc lại “did slightly better”; sau 1 tuần thì thua." },
      { q: "Why can re-reading be misleading?", opts: ["It takes too much time.", "It makes learners more confident than they should be.", "It causes students to sleep less.", "Teachers do not allow it."], a: 1, ex: "Đoạn D: đọc lại khiến người học tự tin, nhưng “this confidence can be misleading”." }
    ]},
    { type: "tfng", labels: ["YES", "NO", "NOT GIVEN"], instr: "Do the following statements agree with the <b>views of the writer</b>? Choose <b>YES</b>, <b>NO</b> or <b>NOT GIVEN</b>.", qs: [
      { q: "The spacing effect is one of the most valuable discoveries in psychology.", a: "YES", ex: "Đoạn B: “In my view, this is one of the most useful findings…”." },
      { q: "Cramming the night before an exam is a good way to learn.", a: "NO", ex: "Đoạn B: tác giả chê học sinh “ignore” hiệu ứng ngắt quãng và chọn học dồn → không đồng tình." },
      { q: "Classroom quizzes should be used mainly to give students grades.", a: "NO", ex: "Đoạn D: “not to grade students, but to help them learn”." },
      { q: "Flashcard apps are too expensive for most learners.", a: "NOT GIVEN", ex: "Tác giả không nói gì về giá của ứng dụng." }
    ]},
    { type: "match", kind: "Summary (chọn từ trong hộp)", instr: "Complete the summary using the list of words, <b>A–H</b>, below.", options: ["A. effort", "B. confidence", "C. sleep", "D. gaps", "E. regularly", "F. once", "G. recognising", "H. long-term"], qs: [
      { q: "Information studied several times with ___ in between is remembered better.", a: 3, ex: "Đoạn B: “studied several times, with gaps in between”." },
      { q: "The ___ of recalling information from memory makes it stronger.", a: 0, ex: "Đoạn D: “the effort of pulling information out of memory strengthens it”." },
      { q: "During deep sleep, the brain moves information into ___ storage.", a: 7, ex: "Đoạn E: “into long-term storage”." },
      { q: "Students who give up ___ in order to study may remember less.", a: 2, ex: "Đoạn E: thức trắng đêm học có thể nhớ kém hơn người ngủ đủ." },
      { q: "Flashcard apps only work if people use them ___.", a: 4, ex: "Đoạn F: “they work only if they are used regularly”." }
    ]}
  ]
},
{
  id: "r-elephants", title: "How Elephants Talk", level: "Band 6.0", topic: "Animals · Science", minutes: 20,
  desc: "Voi giao tiếp bằng âm thanh, rung động và… tên gọi. Có dạng nối nhà nghiên cứu (matching features). 13 câu.",
  paras: [
    ["A", "Elephants are among the most social animals on Earth. Females live in close family groups led by an older female, known as the matriarch, while adult males often travel alone or in small groups. To keep in contact across large areas of grassland and forest, elephants rely on a rich system of communication that scientists are only beginning to understand."],
    ["B", "Many elephant calls are too low for humans to hear. In 1984, the American biologist Katy Payne was watching elephants at a zoo in Portland, Oregon, when she felt a strange throbbing in the air, similar to the feeling of standing near a church organ. She suspected that the animals were producing sounds below the range of human hearing, known as infrasound. Recordings later confirmed this. Because low-frequency sounds travel much further than high ones, these calls allow elephants to communicate over distances of several kilometres."],
    ["C", "Elephants may also \"listen\" with their feet. Caitlin O'Connell, who studied elephants in Namibia, observed that the animals sometimes froze, leaned forward and lifted one foot when other elephants were calling far away. Her experiments suggested that elephants can detect vibrations travelling through the ground, using sensitive cells in their feet and trunks."],
    ["D", "Body language is equally important. Joyce Poole, who has studied the elephants of Amboseli National Park in Kenya since the 1970s, has recorded hundreds of different gestures and postures, from spreading the ears wide to show strength, to touching another elephant's mouth with the trunk as a greeting. Together with her colleagues, she has made these descriptions freely available online so that other researchers and the public can learn from them."],
    ["E", "Perhaps the most surprising discovery came in 2024. A team led by Michael Pardo, working with wild African elephants in Kenya, used machine learning to analyse hundreds of recorded rumbles. The computer was able to identify which elephant a call was meant for more often than would be expected by chance, suggesting that the calls contained something like a name. When the researchers played recordings to the elephants, the animals responded more strongly to calls that had originally been addressed to them. Unlike dolphins, which copy the whistle of the animal they are calling, elephants appeared to use names that did not imitate the receiver's own voice."],
    ["F", "Understanding elephant communication is not only of scientific interest. As human settlements expand, conflicts between people and elephants are increasing, particularly when elephants raid crops. Some researchers hope that a better knowledge of elephant calls could help to warn communities when herds are approaching, or even to keep elephants away from farmland."]
  ],
  groups: [
    { type: "match", kind: "Matching features", instr: "Match each finding with the correct researcher, <b>A–D</b>. You may use any letter more than once.", options: ["A. Katy Payne", "B. Caitlin O'Connell", "C. Joyce Poole", "D. Michael Pardo"], qs: [
      { q: "found evidence that elephants may have individual names", a: 3, ex: "Đoạn E: nhóm của Pardo phát hiện tiếng gọi chứa thứ “giống như tên”." },
      { q: "noticed an unusual physical feeling while watching elephants", a: 0, ex: "Đoạn B: Payne cảm thấy “a strange throbbing in the air”." },
      { q: "shared descriptions of elephant behaviour with the public", a: 2, ex: "Đoạn D: Poole đưa mô tả “freely available online”." },
      { q: "used computers to study elephant sounds", a: 3, ex: "Đoạn E: “used machine learning to analyse… rumbles” (D dùng lần 2)." },
      { q: "suggested that elephants receive messages through the ground", a: 1, ex: "Đoạn C: O'Connell: voi cảm nhận rung động truyền qua mặt đất." }
    ]},
    { type: "tfng", instr: "Do the following statements agree with the information in the passage? Choose <b>TRUE</b>, <b>FALSE</b> or <b>NOT GIVEN</b>.", qs: [
      { q: "Elephant family groups are usually led by an adult male.", a: "FALSE", ex: "Đoạn A: nhóm gia đình do “an older female” dẫn dắt." },
      { q: "Low sounds can travel further than high sounds.", a: "TRUE", ex: "Đoạn B: “low-frequency sounds travel much further than high ones”." },
      { q: "O'Connell carried out her research in Kenya.", a: "FALSE", ex: "Đoạn C: O'Connell nghiên cứu ở Namibia. Kenya là nơi của Poole và Pardo." },
      { q: "Payne's discovery was at first rejected by other scientists.", a: "NOT GIVEN", ex: "Bài chỉ nói ghi âm sau đó xác nhận, không nhắc phản ứng của các nhà khoa học khác." }
    ]},
    { type: "gap", instr: "Complete the sentences. Choose <b>ONE WORD ONLY</b> from the passage for each answer.", qs: [
      { q: "The older female who leads a family group is called the ___.", a: ["matriarch"], ex: "Đoạn A: “known as the matriarch”." },
      { q: "Elephant sounds below the range of human hearing are called ___.", a: ["infrasound"], ex: "Đoạn B: “known as infrasound”." },
      { q: "As a greeting, an elephant may touch another elephant's ___ with its trunk.", a: ["mouth"], ex: "Đoạn D: “touching another elephant's mouth with the trunk as a greeting”." },
      { q: "Elephants cause problems for farmers when they raid ___.", a: ["crops"], ex: "Đoạn F: “when elephants raid crops”." }
    ]}
  ]
},
{
  id: "r-bilingual", title: "The Bilingual Brain", level: "Band 6.0–6.5", topic: "Language · Science", minutes: 20,
  desc: "Song ngữ có làm não khỏe hơn? Có tiêu đề đoạn và dạng “chọn HAI đáp án”. 13 câu.",
  paras: [
    ["A", "More than half of the world's population is often estimated to speak at least two languages. For a long time, however, bilingualism was viewed with suspicion. In the early twentieth century, some educators in Britain and the United States warned parents that learning two languages would confuse young children, slow their intellectual development and harm their performance at school. Many immigrant families were even advised to speak only English at home."],
    ["B", "These fears were largely based on poorly designed studies. Early researchers often tested bilingual children from poor families in their weaker language and compared them with wealthier monolingual children, so it is hardly surprising that the bilingual children scored lower. When a study in Canada in 1962 compared children from similar backgrounds, it found the opposite: the bilingual children performed better on a range of tests."],
    ["C", "Since then, scientists have tried to understand what happens in the brain of a person who speaks two languages. Brain-imaging studies show that both languages remain active even when only one is being used. A bilingual speaker must therefore constantly select the right language and suppress the other. Some researchers, most famously the Canadian psychologist Ellen Bialystok, have argued that this daily mental exercise strengthens \"executive function\", the set of skills we use to focus attention, ignore distractions and switch between tasks."],
    ["D", "One of the most widely reported claims concerns old age. In a 2007 study of patients at a memory clinic in Toronto, Bialystok and her colleagues found that bilingual patients had developed symptoms of dementia about four years later, on average, than monolingual patients. The researchers suggested that speaking two languages might help to build a \"cognitive reserve\" that protects the brain as it ages."],
    ["E", "However, the picture is not as simple as these early findings suggested. In the last fifteen years, several large studies have failed to find any clear advantage for bilinguals in tests of executive function. Critics point out that studies with surprising positive results are more likely to be published than those that find nothing, which may have exaggerated the benefits. Others argue that bilingualism is not a single experience: someone who learned two languages from birth and uses both every day may be very different from a person who studied a second language at school."],
    ["F", "Whatever the truth about these effects on the brain, few experts doubt the practical and social benefits of speaking more than one language. Bilingual people can communicate with a wider range of people, have access to more job opportunities and can enjoy literature, films and music from other cultures in their original form. And unlike the warnings of the early twentieth century, there is now no serious evidence that learning two languages harms children's development."]
  ],
  groups: [
    { type: "match", kind: "Matching headings", instr: "Choose the correct heading for paragraphs <b>B–F</b> from the list of headings below.", options: ["i. Benefits that are not in doubt", "ii. A possible protection against an illness of old age", "iii. Mistakes in early research", "iv. Why children should learn languages early", "v. A constant mental workout", "vi. Reasons to question the evidence", "vii. How bilingual people choose a career"], qs: [
      { q: "Paragraph B", a: 2, ex: "Đoạn B: các nghiên cứu cũ “poorly designed” → sai lầm của nghiên cứu ban đầu." },
      { q: "Paragraph C", a: 4, ex: "Đoạn C: não luôn phải chọn ngôn ngữ và kìm ngôn ngữ kia, “daily mental exercise”." },
      { q: "Paragraph D", a: 1, ex: "Đoạn D: song ngữ làm triệu chứng sa sút trí tuệ (dementia) xuất hiện muộn hơn." },
      { q: "Paragraph E", a: 5, ex: "Đoạn E: “the picture is not as simple”, nhiều nghiên cứu lớn không tìm thấy lợi thế." },
      { q: "Paragraph F", a: 0, ex: "Đoạn F: “few experts doubt the practical and social benefits”. Bẫy vii: có nhắc “job opportunities” nhưng chỉ là chi tiết." }
    ]},
    { type: "multi", instr: "Choose <b>TWO</b> letters, <b>A–E</b>.", qs: [
      { q: "Which TWO problems with early research on bilingual children are mentioned?", opts: ["The children were tested in their weaker language.", "The tests were too easy.", "The bilingual children came from poorer families.", "The studies were carried out in Canada.", "The children were too young to be tested."], a: [0, 2], ex: "Đoạn B: trẻ bị kiểm tra bằng “weaker language” và đến từ “poor families”. Canada là nơi có nghiên cứu ĐÚNG năm 1962." },
      { q: "Which TWO criticisms of recent claims about bilingual advantages are mentioned?", opts: ["Studies with positive results are published more often.", "Brain-imaging equipment is unreliable.", "Bilingual experiences differ greatly between people.", "Dementia cannot be measured accurately.", "The researchers were paid by language schools."], a: [0, 2], ex: "Đoạn E: kết quả tích cực dễ được công bố hơn; và song ngữ “is not a single experience”." }
    ]},
    { type: "gap", instr: "Complete the summary. Choose <b>ONE WORD ONLY</b> from the passage for each answer.", qs: [
      { q: "In the early 1900s, some educators believed that two languages would ___ young children.", a: ["confuse"], ex: "Đoạn A: “would confuse young children”." },
      { q: "In a bilingual brain, both languages stay ___ even when only one is being used.", a: ["active"], ex: "Đoạn C: “both languages remain active”." },
      { q: "Bialystok's 2007 study was carried out at a memory ___ in Toronto.", a: ["clinic"], ex: "Đoạn D: “a memory clinic in Toronto”." },
      { q: "Speaking two languages might help to build a cognitive ___.", a: ["reserve"], ex: "Đoạn D: “a cognitive reserve”." }
    ]}
  ]
}
);

{
  id: "r-bees", title: "The Busy World of Honeybees", level: "Band 5.0", topic: "Animals · Nature", minutes: 15,
  desc: "Đời sống đàn ong và vì sao ong quan trọng với nông nghiệp. TRUE/FALSE/NOT GIVEN, điền từ, trắc nghiệm. 13 câu.",
  paras: [
    ["A", "A single honeybee colony can contain more than 50,000 insects, yet it works almost like one living creature. At the centre of the colony is the queen, whose main job is to lay eggs – up to 2,000 a day in summer. Almost all the other bees are female workers. The small number of males, called drones, do not collect food or help with building; their only role is to mate with a queen from another colony."],
    ["B", "Worker bees change jobs as they grow older. For the first few weeks of their lives, they stay inside the hive. They clean cells, feed young bees, build wax comb and guard the entrance. Only in the last part of their lives, which in summer usually lasts about six weeks in total, do they fly outside to collect nectar and pollen from flowers."],
    ["C", "When a worker finds a good source of food, she returns to the hive and performs a special movement known as the \"waggle dance\". By moving in a figure-of-eight pattern and shaking her body, she tells other bees in which direction the flowers are and how far away they are. The Austrian scientist Karl von Frisch received a Nobel Prize in 1973 partly for explaining this remarkable form of communication."],
    ["D", "Nectar is turned into honey inside the hive. Bees add enzymes to it and then fan their wings over the cells to remove water. When the honey is thick enough, they seal each cell with a thin layer of wax. A colony may need to collect nectar from around two million flowers to make just half a kilogram of honey."],
    ["E", "Bees are important to people for much more than honey. As they move from flower to flower, they carry pollen, which allows plants to produce fruit and seeds. Many crops, including apples, almonds and coffee, depend partly on insects for pollination. In California, for example, beekeepers transport hundreds of thousands of hives to almond farms every spring."],
    ["F", "In recent years, many beekeepers have reported losing large numbers of colonies. Scientists believe there is no single cause. Instead, a combination of problems, such as certain pesticides, parasites like the varroa mite, poor diet and changes in weather, is making bees weaker. Some cities have responded by planting more wild flowers in parks and along roads, giving bees a wider variety of food."]
  ],

      { q: "Drones help to collect food for the colony.", a: "FALSE", ex: "Đoạn A: drones “do not collect food”." },
      { q: "Young worker bees spend their first weeks inside the hive.", a: "TRUE", ex: "Đoạn B: “For the first few weeks… they stay inside the hive”." },
      { q: "Worker bees live longer in winter than in summer.", a: "NOT GIVEN", ex: "Bài chỉ nói tuổi thọ mùa hè khoảng 6 tuần, không so sánh với mùa đông." },
      { q: "Karl von Frisch was the first person to keep bees in a laboratory.", a: "NOT GIVEN", ex: "Đoạn C chỉ nói ông giải thích điệu nhảy, không nói gì về việc nuôi ong trong phòng thí nghiệm." }
    ]},
    { type: "gap", instr: "Complete the sentences. Choose <b>ONE WORD AND/OR A NUMBER</b> from the passage for each answer.", qs: [
      { q: "In summer, a queen can lay as many as ___ eggs a day.", a: ["2,000", "2000"], ex: "Đoạn A: “up to 2,000 a day in summer”." },
      { q: "In the waggle dance, the bee moves in a ___ pattern.", a: ["figure-of-eight", "figure of eight"], ex: "Đoạn C: “moving in a figure-of-eight pattern”." },
      { q: "Bees remove water from nectar by moving their ___ over the cells.", a: ["wings"], ex: "Đoạn D: “fan their wings over the cells to remove water”." },
      { q: "Full cells of honey are closed with a thin layer of ___.", a: ["wax"], ex: "Đoạn D: “seal each cell with a thin layer of wax”." }

    { type: "mcq", instr: "Choose the correct letter, <b>A, B, C or D</b>.", qs: [
      { q: "Why are hives taken to almond farms in California?", opts: ["to produce more honey", "to pollinate the almond trees", "to protect the bees from pesticides", "to test new types of hive"], a: 1, ex: "Đoạn E: ong mang phấn hoa giúp cây ra quả; nông trại hạnh nhân cần ong thụ phấn." },
      { q: "According to scientists, colony losses are caused by", opts: ["pesticides only", "a new parasite", "several problems together", "colder winters"], a: 2, ex: "Đoạn F: “there is no single cause… a combination of problems”." },
      { q: "How have some cities tried to help bees?", opts: ["by banning beekeeping", "by planting more wild flowers", "by building hives on roofs", "by reducing traffic"], a: 1, ex: "Đoạn F: “planting more wild flowers in parks and along roads”." },
      { q: "What is the passage mainly about?", opts: ["how to start keeping bees", "the history of honey", "how bee colonies work and why bees matter", "the dangers of bee stings"], a: 2, ex: "Bài nói về tổ chức đàn ong (A–D) và vai trò, nguy cơ của ong (E–F)." }

{
  id: "r-whales", title: "Why Do Whales Strand?", level: "Band 5.5", topic: "Animals · Ocean", minutes: 20,
  desc: "Hiện tượng cá voi, cá heo mắc cạn hàng loạt và các giả thuyết khoa học. Matching Headings, điền từ, TRUE/FALSE/NOT GIVEN. 13 câu.",
  paras: [
    ["A", "Every year, people around the world find whales and dolphins lying on beaches, unable to return to the sea. Usually only one animal is involved, and it is often old, sick or injured. Sometimes, however, dozens or even hundreds of animals come ashore together. These events, known as mass strandings, have puzzled people for centuries, and they still are not fully understood."],
    ["B", "Mass strandings happen more often in some places than others. Certain coasts, such as parts of New Zealand, Tasmania and Cape Cod in the United States, have long, gently sloping beaches and shallow bays. In such places, the water may become shallow so gradually that animals do not realise they are in danger until the tide goes out and they are trapped."],
    ["C", "Social behaviour also seems to be important. Pilot whales, which are involved in many mass strandings, live in groups with very strong family bonds. If one member of the group, perhaps a leader, swims into shallow water because it is ill or confused, the others may follow it rather than leave it alone. Rescuers have noticed that animals pushed back into the sea sometimes return to the beach to stay close to the rest of the group."],
    ["D", "Many whales and dolphins find their way using echolocation: they produce clicks and listen to the echoes to build a picture of their surroundings. Some researchers believe that loud human noise, such as military sonar used by navies to find submarines, can disturb this system. Several strandings of beaked whales have taken place soon after naval exercises nearby, although it is often difficult to prove a direct link."],
    ["E", "Another theory involves the Earth's magnetic field. Some scientists think whales may use it like a map when they travel long distances. Storms on the Sun can change the magnetic field for short periods, and it is possible that this confuses animals and sends them in the wrong direction. This idea is interesting, but there is not yet enough evidence to support it."],
    ["F", "When a stranding happens, quick action can save lives. Volunteers keep the animals wet and cool, cover their skin to protect it from the sun, and wait for the next high tide to help them float again. In New Zealand, a national charity trains thousands of members of the public to do this work. Even so, not every animal can be rescued, and sometimes the kindest decision is to end the suffering of an animal that is too weak to survive."]
  ],
  groups: [
    { type: "match", instr: "The passage has six paragraphs, <b>A–F</b>. Choose the correct heading for paragraphs <b>B–E</b> from the list of headings below.", options: ["i. A link with man-made sound", "ii. The shape of the coastline", "iii. How whales choose a leader", "iv. A natural mystery", "v. Loyalty to the group", "vi. A possible role for the Sun", "vii. Why whale numbers are falling"], qs: [
      { q: "Paragraph B", a: 1, ex: "Đoạn B nói về bãi biển thoải, vịnh nông → hình dạng bờ biển (ii)." },
      { q: "Paragraph C", a: 4, ex: "Đoạn C: cả đàn đi theo con bị bệnh, quay lại bãi để ở gần đàn → sự gắn bó với nhóm (v). Bẫy: (iii) nhắc “leader” nhưng đoạn không nói cách chọn đầu đàn." },
      { q: "Paragraph D", a: 0, ex: "Đoạn D: tiếng ồn, sonar quân sự → âm thanh do con người tạo ra (i)." },
      { q: "Paragraph E", a: 5, ex: "Đoạn E: bão Mặt Trời làm thay đổi từ trường (vi)." }
    ]},
    { type: "gap", instr: "Complete the notes. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.", qs: [
      { q: "Single strandings: the animal is often old, sick or ___.", a: ["injured"], ex: "Đoạn A: “old, sick or injured”." },
      { q: "Dangerous coasts have gently sloping beaches and shallow ___.", a: ["bays"], ex: "Đoạn B: “shallow bays”." },
      { q: "Whales and dolphins use clicks and echoes – a system called ___.", a: ["echolocation"], ex: "Đoạn D." },
      { q: "Navies use ___ to find submarines.", a: ["military sonar", "sonar"], ex: "Đoạn D: “military sonar used by navies to find submarines”." },
      { q: "Rescuers wait for the next ___ so the animals can float again.", a: ["high tide"], ex: "Đoạn F: “wait for the next high tide”." }
    ]},
    { type: "tfng", instr: "Do the following statements agree with the information in the passage? Choose <b>TRUE</b>, <b>FALSE</b> or <b>NOT GIVEN</b>.", qs: [

      { q: "Pilot whales are the largest species of dolphin.", a: "NOT GIVEN", ex: "Bài không nói về kích thước của cá voi hoa tiêu." },

{
  id: "r-container", title: "The Box That Changed the World", level: "Band 6.0", topic: "Business · Transport", minutes: 20,
  desc: "Container vận chuyển đã thay đổi thương mại và các cảng biển ra sao. TRUE/FALSE/NOT GIVEN, trắc nghiệm, điền tóm tắt. 13 câu.",
  paras: [
    ["A", "For most of history, loading a ship was slow, hard and expensive work. Goods arrived at ports in sacks, barrels and wooden boxes of every shape and size, and teams of dock workers carried them onto the ship one by one. A large cargo ship could spend a week or more in port being loaded and unloaded, and goods were often damaged or stolen along the way. In some cases, the cost of handling cargo in port was greater than the cost of the sea journey itself."],
    ["B", "The solution came from an unlikely person. Malcom McLean was an American trucking businessman, not a sailor. In the 1950s, frustrated by the hours his drivers spent waiting at ports, he developed the idea of lifting whole truck bodies, or containers, straight onto ships without unpacking them. In 1956, his converted ship, the Ideal X, sailed from New Jersey to Texas carrying 58 metal containers."],
    ["C", "The real breakthrough, however, was standardisation. Containers were only truly efficient if every port, ship, train and truck could handle the same boxes. During the 1960s, international agreements set standard sizes, and the twenty-foot container became the unit used to measure a ship's capacity, known as the TEU (twenty-foot equivalent unit). Once these standards were in place, a container could travel from a factory in one country to a shop in another without its contents ever being touched."],
    ["D", "The effects were enormous. Loading times fell from days to hours, and the cost of shipping goods dropped dramatically. Theft and damage also became much less common, because containers are locked and sealed. Economists argue that cheap and reliable shipping was one of the main reasons for the rapid growth of world trade in the late twentieth century, making it possible for companies to build products using parts from many different countries."],
    ["E", "Ports themselves changed completely. Traditional harbours in city centres, with narrow streets and small warehouses, could not deal with huge container ships, which need deep water, giant cranes and large areas of flat land for storage. New container terminals were built further away, and many old docks closed. In cities such as London and New York, former port areas have since been turned into offices, apartments and leisure centres. At the same time, tens of thousands of dock workers lost their jobs, as machines replaced human labour."],
    ["F", "Today, the largest container ships can carry more than 24,000 TEU. Most new terminals are increasingly automated, with computer-controlled cranes and driverless vehicles moving boxes around the port. However, size brings new risks. When one very large ship became stuck in the Suez Canal for six days in 2021, it blocked one of the world's busiest trade routes and showed how much the global economy depends on this simple metal box."]
  ],
  groups: [
    { type: "tfng", instr: "Do the following statements agree with the information in the passage? Choose <b>TRUE</b>, <b>FALSE</b> or <b>NOT GIVEN</b>.", qs: [
      { q: "Before containers, port costs could be higher than the cost of the voyage.", a: "TRUE", ex: "Đoạn A: “the cost of handling cargo in port was greater than the cost of the sea journey itself”." },
      { q: "Malcom McLean had worked as a ship's captain before starting his business.", a: "FALSE", ex: "Đoạn B: “a trucking businessman, not a sailor”." },
      { q: "The Ideal X was the largest ship in the United States at the time.", a: "NOT GIVEN", ex: "Bài không nói kích thước của Ideal X so với các tàu khác." },
      { q: "Containers made it harder for thieves to steal goods.", a: "TRUE", ex: "Đoạn D: “Theft… became much less common, because containers are locked and sealed”." }
    ]},
    { type: "mcq", instr: "Choose the correct letter, <b>A, B, C or D</b>.", qs: [
      { q: "According to paragraph C, containers became truly efficient when", opts: ["ships became faster", "the same sizes were used everywhere", "trains replaced trucks", "factories moved closer to ports"], a: 1, ex: "Đoạn C: “The real breakthrough, however, was standardisation”." },
      { q: "What is a TEU?", opts: ["a type of crane", "a shipping company", "a unit for measuring ship capacity", "an international agreement"], a: 2, ex: "Đoạn C: “the unit used to measure a ship's capacity, known as the TEU”." },
      { q: "Why did many old city-centre docks close?", opts: ["They were too expensive to rent.", "They lacked the space and deep water modern ships need.", "Governments wanted to build apartments.", "Dock workers went on strike."], a: 1, ex: "Đoạn E: cảng cũ không đáp ứng “deep water, giant cranes and large areas of flat land”." },
      { q: "The writer mentions the Suez Canal incident to show that", opts: ["canals are too narrow for modern ships", "automation causes accidents", "world trade relies heavily on container shipping", "ships should be made smaller"], a: 2, ex: "Đoạn F: “showed how much the global economy depends on this simple metal box”." }
    ]},
    { type: "gap", instr: "Complete the summary. Choose <b>ONE WORD ONLY</b> from the passage for each answer.", qs: [
      { q: "Containers reduced loading times from days to ___.", a: ["hours"], ex: "Đoạn D." },
      { q: "Cheap shipping helped companies make products using ___ from many countries.", a: ["parts"], ex: "Đoạn D: “using parts from many different countries”." },
      { q: "Many dock workers lost their jobs because ___ replaced them.", a: ["machines"], ex: "Đoạn E: “as machines replaced human labour”." },
      { q: "Modern terminals use computer-controlled cranes and ___ vehicles.", a: ["driverless"], ex: "Đoạn F." },
      { q: "In 2021 a ship was stuck in the canal for ___ days.", a: ["six", "6"], ex: "Đoạn F: “stuck in the Suez Canal for six days”." }
    ]}
  ]
},
{
  id: "r-intern", title: "Learning on the Job", level: "Band 5.5–6.0", topic: "Work · Education", minutes: 20,
  desc: "Thực tập và học việc: lợi ích, vấn đề “thực tập không lương”. Matching information, YES/NO/NOT GIVEN, trắc nghiệm. 13 câu.",
  paras: [
    ["A", "For many university students, the first real experience of work comes through a work placement or internship: a period of weeks or months spent working in an organisation, usually connected to their subject. Some courses, especially in engineering, business and nursing, include a placement as a compulsory part of the degree. Other students arrange internships themselves during their summer holidays."],
    ["B", "Supporters say placements help students in several ways. Students can put the theory they have learned into practice and discover whether they really enjoy a particular career before committing to it. They also develop so-called soft skills, such as teamwork, time management and communicating with customers, which are difficult to learn in a lecture hall. In my opinion, this practical experience is just as valuable as anything learned from textbooks."],
    ["C", "There is also evidence that placements improve students' job prospects. Several surveys of graduates in the United Kingdom have found that those who completed a year in industry were more likely to be in professional jobs six months after graduating. Employers often use internships as a kind of long job interview, and many offer permanent positions to their best interns."],
    ["D", "Employers benefit too. Interns bring fresh ideas and are often confident with new technology. A well-organised placement scheme can help a company find talented young people before its competitors do, and it costs much less than advertising for new staff. Small businesses, however, may struggle to provide proper training, because experienced staff simply do not have the time to supervise a student."],
    ["E", "Not all internships are positive experiences. In some industries, such as fashion, media and politics, unpaid internships have been common. Critics argue that this is unfair, since only young people whose families can support them are able to work for free, especially in expensive cities. I believe that interns who do real work should always be paid, and in some countries the law now requires this."],
    ["F", "So what makes a good placement? Research suggests that the most important factor is the quality of supervision. Interns who have a named mentor, receive regular feedback and are given meaningful tasks, rather than simply making coffee or photocopying, report far higher satisfaction. Universities can also help by preparing students before the placement and asking them to reflect on what they learned afterwards."]
  ],
  groups: [
    { type: "match", kind: "Matching information", noList: true, instr: "The passage has six paragraphs, <b>A–F</b>. Which paragraph contains the following information? You may use any letter more than once.", options: ["A", "B", "C", "D", "E", "F"], qs: [
      { q: "a reason why small companies may find it hard to offer placements", a: 3, ex: "Đoạn D: doanh nghiệp nhỏ “may struggle to provide proper training”." },
      { q: "examples of subjects where a placement is required", a: 0, ex: "Đoạn A: engineering, business, nursing." },
      { q: "a description of tasks that interns find unsatisfying", a: 5, ex: "Đoạn F: “simply making coffee or photocopying”." },
      { q: "a comparison between graduates who did and did not do placements", a: 2, ex: "Đoạn C: người có năm thực tập dễ có việc chuyên môn hơn." },
      { q: "industries where people often work without pay", a: 4, ex: "Đoạn E: fashion, media, politics." }
    ]},
    { type: "tfng", labels: ["YES", "NO", "NOT GIVEN"], instr: "Do the following statements agree with the <b>views of the writer</b>? Choose <b>YES</b>, <b>NO</b> or <b>NOT GIVEN</b>.", qs: [
      { q: "Practical work experience is less important than academic study.", a: "NO", ex: "Đoạn B: “just as valuable as anything learned from textbooks” → ngang nhau, không kém hơn." },
      { q: "Interns who do real work should receive payment.", a: "YES", ex: "Đoạn E: “I believe that interns who do real work should always be paid”." },
      { q: "Internships abroad are more useful than internships at home.", a: "NOT GIVEN", ex: "Tác giả không so sánh thực tập trong nước và nước ngoài." },
      { q: "Unpaid internships are acceptable in the fashion industry.", a: "NO", ex: "Đoạn E: tác giả cho rằng thực tập không lương là không công bằng." }
    ]},
    { type: "mcq", instr: "Choose the correct letter, <b>A, B, C or D</b>.", qs: [
      { q: "According to the passage, employers sometimes use internships to", opts: ["avoid paying staff", "test possible future employees", "train their managers", "advertise their products"], a: 1, ex: "Đoạn C: “a kind of long job interview”." },
      { q: "The most important factor in a good placement is", opts: ["the length of the placement", "the salary", "the quality of supervision", "the size of the company"], a: 2, ex: "Đoạn F: “the most important factor is the quality of supervision”." },
      { q: "How can universities help, according to paragraph F?", opts: ["by paying interns", "by finding placements abroad", "by preparing students and asking them to reflect", "by supervising interns at work"], a: 2, ex: "Đoạn F: “preparing students before… reflect on what they learned afterwards”." },
      { q: "Which skill is NOT mentioned as a soft skill in paragraph B?", opts: ["teamwork", "time management", "communicating with customers", "computer programming"], a: 3, ex: "Đoạn B chỉ liệt kê teamwork, time management, communicating with customers." }
    ]}
  ]
},
{
  id: "r-tourism", title: "When Tourists Become Too Many", level: "Band 6.0–6.5", topic: "Tourism · Society", minutes: 20,
  desc: "Du lịch quá tải (overtourism) và các giải pháp của thành phố. Matching Headings, chọn 2 đáp án, tóm tắt chọn từ trong hộp. 13 câu.",
  paras: [
    ["A", "International tourism has grown remarkably over the past half century. In 1950, around 25 million international trips were recorded; before the pandemic in 2019, the figure was close to 1.5 billion. Cheaper flights, online booking and a growing middle class in Asia have all made travel possible for far more people. For many countries, tourism is now a major source of income and employment."],
    ["B", "Yet in some of the world's most popular destinations, residents have begun to protest. In Venice, the number of visitors on a busy day can be greater than the city's permanent population. In Barcelona, local people have complained that holiday rentals have pushed up rents and changed the character of whole neighbourhoods. The term \"overtourism\" has been used to describe situations in which visitor numbers seriously reduce the quality of life of residents or damage the experience of visitors themselves."],
    ["C", "The problem is not simply the total number of tourists, but their concentration. Most visitors want to see the same famous sights, at the same times of year and often at the same times of day. Cruise ships, which can bring several thousand passengers into a small port for just a few hours, are a particular concern, because these visitors crowd the centre but spend relatively little money locally."],
    ["D", "The natural environment can also suffer. Popular beaches, mountains and coral reefs can be damaged by large numbers of people. In 2018, the Philippine government closed the island of Boracay to tourists for six months to clean up polluted water and repair its infrastructure. Thailand's Maya Bay, made famous by a Hollywood film, was closed for several years to allow its coral and marine life to recover."],
    ["E", "Cities have tried a range of solutions. Amsterdam has stopped issuing licences for new tourist shops in the historic centre and has limited short-term holiday rentals. Venice introduced a fee for day visitors on its busiest days in 2024. Other destinations are encouraging tourists to visit lesser-known areas or to travel outside the peak season, using marketing campaigns and lower prices."],
    ["F", "Experts generally agree that the aim should not be to stop tourism, which brings real benefits, but to manage it better. This means collecting accurate data on visitor numbers, involving residents in decisions and making sure that more of the money spent by tourists stays in the local community. As one researcher put it, the question is not how many tourists a place can attract, but how many it can welcome well."]
  ],
  groups: [
    { type: "match", instr: "Choose the correct heading for paragraphs <b>B–E</b> from the list of headings below.", options: ["i. Protecting nature by closing sites", "ii. Local anger in famous cities", "iii. The history of package holidays", "iv. Too many people in the same places", "v. Policies to control and spread visitors", "vi. Why tourism creates jobs", "vii. The rise of eco-tourism"], qs: [
      { q: "Paragraph B", a: 1, ex: "Đoạn B: người dân Venice, Barcelona phản đối → (ii)." },
      { q: "Paragraph C", a: 3, ex: "Đoạn C: vấn đề là sự tập trung du khách cùng chỗ, cùng giờ → (iv)." },
      { q: "Paragraph D", a: 0, ex: "Đoạn D: đóng cửa Boracay, Maya Bay để phục hồi thiên nhiên → (i)." },
      { q: "Paragraph E", a: 4, ex: "Đoạn E: Amsterdam, Venice và các nơi khác đưa ra chính sách → (v)." }
    ]},
    { type: "multi", instr: "Choose <b>TWO</b> letters, <b>A–E</b>.", qs: [
      { q: "Which TWO reasons for the growth of tourism are mentioned in paragraph A?", opts: ["cheaper flights", "better hotels", "online booking", "longer holidays", "safer travel"], a: [0, 2], ex: "Đoạn A: “Cheaper flights, online booking and a growing middle class”." },
      { q: "Which TWO problems are caused by cruise ship visitors?", opts: ["They damage coral reefs.", "They crowd the city centre.", "They stay in holiday rentals.", "They spend little money locally.", "They arrive outside the peak season."], a: [1, 3], ex: "Đoạn C: “these visitors crowd the centre but spend relatively little money locally”." }
    ]},
    { type: "match", kind: "Summary (chọn từ trong hộp)", instr: "Complete the summary using the list of words, <b>A–I</b>, below.", options: ["A. residents", "B. fee", "C. data", "D. stop", "E. licences", "F. manage", "G. season", "H. money", "I. films"], qs: [
      { q: "Amsterdam no longer gives ___ for new tourist shops in its old centre.", a: 4, ex: "Đoạn E: “stopped issuing licences for new tourist shops”." },
      { q: "Venice now charges day visitors a ___ on busy days.", a: 1, ex: "Đoạn E: “a fee for day visitors”." },
      { q: "Some places encourage tourists to come outside the peak ___.", a: 6, ex: "Đoạn E: “travel outside the peak season”." },
      { q: "Experts say the goal is to ___ tourism rather than end it.", a: 5, ex: "Đoạn F: “not to stop tourism… but to manage it better”." },
      { q: "Good management includes involving ___ in decisions.", a: 0, ex: "Đoạn F: “involving residents in decisions”." }
    ]}
  ]
},
{
  id: "r-heat", title: "Cooling the Cities", level: "Band 6.5", topic: "Cities · Climate", minutes: 20,
  desc: "Hiệu ứng đảo nhiệt đô thị và cách các thành phố làm mát. Matching information, trắc nghiệm, điền tóm tắt. 13 câu.",
  paras: [
    ["A", "On a hot summer evening, the centre of a large city can be several degrees warmer than the surrounding countryside. This difference, known as the urban heat island effect, was first described in the early nineteenth century by Luke Howard, an amateur scientist who recorded temperatures in and around London. Today, with more than half of the world's population living in urban areas and heatwaves becoming more frequent, the effect has become a serious concern for city planners."],
    ["B", "Several factors combine to make cities warmer. Dark surfaces such as asphalt roads and roofs absorb a large proportion of the sun's energy during the day and release it slowly at night. Tall buildings trap heat and reduce the wind that might otherwise carry it away. In addition, cars, air-conditioning units and factories all produce waste heat. By contrast, in the countryside, plants and soil hold water, and the evaporation of this water cools the air."],
    ["C", "The consequences can be severe. High night-time temperatures are particularly dangerous, because the human body has no chance to recover from the heat of the day. Elderly people, young children and those with heart or breathing problems are most at risk. Hotter cities also use more electricity for cooling, which increases costs and, where electricity comes from fossil fuels, adds to the greenhouse gases that cause climate change in the first place."],
    ["D", "One of the simplest solutions is to change the colour of surfaces. White or specially coated \"cool roofs\" reflect much more sunlight than dark ones and can reduce the temperature of the building beneath them. Several cities, including New York, have run programmes to paint thousands of square metres of roofs white. Some places are also experimenting with lighter-coloured road surfaces, although these can create glare for drivers."],
    ["E", "Many experts, however, believe that plants offer the greatest benefits. Trees provide shade and cool the air through evaporation, while also absorbing rainwater and providing homes for wildlife. Singapore has become well known for its \"city in a garden\" approach, which includes green roofs, walls covered in plants and large parks. Medellín in Colombia created a network of green corridors along roads and streams, and the city reports that temperatures in these areas have fallen noticeably."],
    ["F", "Water can help too. Fountains, ponds and rivers cool their surroundings, and some cities have uncovered rivers that had been buried under concrete decades earlier. In Seoul, the restoration of the Cheonggyecheon stream, which involved removing an elevated highway, created a popular public space where temperatures are measurably lower than on nearby streets. Such projects are expensive, but supporters argue that their benefits for health, wildlife and quality of life make them worthwhile."]
  ],
  groups: [
    { type: "match", kind: "Matching information", noList: true, instr: "The passage has six paragraphs, <b>A–F</b>. Which paragraph contains the following information? You may use any letter more than once.", options: ["A", "B", "C", "D", "E", "F"], qs: [
      { q: "a disadvantage of one cooling method", a: 3, ex: "Đoạn D: mặt đường sáng màu “can create glare for drivers”." },
      { q: "the name of the person who first identified the effect", a: 0, ex: "Đoạn A: Luke Howard." },
      { q: "groups of people who are most in danger from heat", a: 2, ex: "Đoạn C: người già, trẻ nhỏ, người bệnh tim/phổi." },
      { q: "an example of a road being removed to bring back nature", a: 5, ex: "Đoạn F: Seoul gỡ đường cao tốc trên cao để khôi phục suối Cheonggyecheon." }
    ]},
    { type: "mcq", instr: "Choose the correct letter, <b>A, B, C or D</b>.", qs: [
      { q: "Why does the countryside stay cooler than cities?", opts: ["It has fewer people.", "Water evaporates from plants and soil.", "It receives less sunlight.", "It has more wind farms."], a: 1, ex: "Đoạn B: “plants and soil hold water, and the evaporation of this water cools the air”." },
      { q: "Why are hot nights especially dangerous?", opts: ["People cannot sleep with air-conditioning.", "Electricity is more expensive at night.", "The body cannot recover from daytime heat.", "Hospitals are closed."], a: 2, ex: "Đoạn C: “the human body has no chance to recover from the heat of the day”." },
      { q: "What does the writer say about air-conditioning in hot cities?", opts: ["It solves the heat problem completely.", "It may make climate change worse.", "It is banned in some cities.", "It is cheaper than planting trees."], a: 1, ex: "Đoạn C: dùng nhiều điện từ nhiên liệu hóa thạch “adds to the greenhouse gases”." },
      { q: "According to many experts, the most effective solution is", opts: ["cool roofs", "lighter roads", "plants and trees", "fountains"], a: 2, ex: "Đoạn E: “plants offer the greatest benefits”." }
    ]},
    { type: "gap", instr: "Complete the summary. Choose <b>ONE WORD ONLY</b> from the passage for each answer.", qs: [
      { q: "Dark roofs and roads absorb the sun's energy and release it slowly at ___.", a: ["night"], ex: "Đoạn B." },
      { q: "Tall buildings trap heat and reduce the ___.", a: ["wind"], ex: "Đoạn B: “reduce the wind that might otherwise carry it away”." },
      { q: "Cool roofs ___ much more sunlight than dark roofs.", a: ["reflect"], ex: "Đoạn D." },
      { q: "Besides cooling the air, trees absorb rainwater and provide homes for ___.", a: ["wildlife"], ex: "Đoạn E." },
      { q: "Restoration projects are ___, but supporters believe they are worth it.", a: ["expensive"], ex: "Đoạn F: “Such projects are expensive”." }
    ]}
  ]
}
);

  context: "You will hear part of a lecture about coral reefs.",
  names: { L: "Lecturer" }, voices: { L: "B" },
  script: [
    ["L", "Today we're looking at coral reefs, which are often described as the rainforests of the sea. Although many people think corals are plants, or even rocks, they are in fact animals. Each coral is made up of thousands of tiny creatures called polyps, which build a hard skeleton of limestone around themselves. Over thousands of years, these skeletons build up to form a reef."],
    ["L", "Most reef-building corals live in a partnership with microscopic algae, which live inside their tissue. The algae use sunlight to produce food, and they pass much of this food to the coral. In return, the coral gives the algae shelter. The algae are also what give corals their bright colours. This is why most reefs are found in shallow, clear water, where there is plenty of light."],
    ["L", "Coral reefs cover less than one percent of the ocean floor, yet they support around a quarter of all marine species. They also protect coastlines from storms by reducing the power of waves, and they provide food and income for hundreds of millions of people through fishing and tourism."],
    ["L", "Unfortunately, reefs are under serious threat. The biggest danger is rising sea temperatures. When the water becomes too warm, corals become stressed and push out the algae living inside them. Without the algae, the coral turns white, a process known as bleaching. Bleached corals are not dead, but if high temperatures continue for several weeks, they may starve. Other threats include pollution from farms, which runs into the sea, and overfishing, which upsets the balance of the reef."],
    ["L", "So what can be done? The most important long-term solution is to reduce greenhouse gas emissions. But scientists are also trying some more direct methods. One is coral gardening. Small pieces of coral are grown in underwater nurseries, rather like a plant nursery, and then moved onto damaged reefs. Researchers are also breeding corals that are better able to survive heat. Finally, creating marine protected areas, where fishing is limited, gives reefs a better chance to recover."]
  ],
  groups: [
    { type: "gap", kind: "Note completion", instr: "Complete the notes. Write <b>ONE WORD ONLY</b> for each answer.", qs: [

    ]}
  ]
}

  sample: "Governments have limited budgets, so they must decide how to divide money between different areas. Some people believe that public money should be spent only on essential services, while others think that the arts also deserve funding. This essay will discuss both views and explain why I believe the arts should still receive some support.\n\nOn the one hand, it is easy to understand why many people think public services should come first. Hospitals, schools and public transport affect the daily lives of every citizen, and in many countries these services are still underfunded. When patients wait months for an operation or children study in overcrowded classrooms, spending money on theatres or art galleries can seem unfair. Moreover, popular forms of art, such as films and music, can often earn enough money from ticket sales without government help.\n\nOn the other hand, I believe that supporting the arts is also a responsibility of the government. Firstly, art plays a vital role in preserving a nation's culture and identity. Traditional crafts, folk music and historic theatres may disappear if they rely only on the market. Secondly, cultural activities bring economic benefits: museums, festivals and concerts attract tourists, who spend money in local businesses and create jobs. Finally, the arts improve people's quality of life and mental health, which in the long term may even reduce pressure on public services.\n\nIn conclusion, although essential services such as healthcare and education should receive the largest share of public money, I do not think that the arts should be ignored. A small but stable budget for culture can bring significant benefits to society as a whole."

{
  id: "w2-alone", task: 2, kind: "Advantages / Disadvantages", title: "Living alone",

    "<b>Thân bài 2:</b> bất lợi: tốn kém (một mình trả hết chi phí, đẩy giá nhà); nguy cơ cô đơn, nhất là người già.",
    "<b>Kết bài:</b> nhắc lại quan điểm + gợi ý cộng đồng hỗ trợ kết nối."

  sample: "In many countries, the number of people who live alone has risen considerably in recent decades. Although this trend brings some benefits for individuals, I believe that its disadvantages are more significant.\n\nThere are certainly some advantages to living alone. The most obvious is independence: people who live by themselves can decide how to organise their home, when to eat and sleep, and how to spend their free time without having to consider anyone else. This freedom can help young adults become more responsible and self-reliant, as they must manage their own money, cooking and housework. In addition, some people find that having their own space reduces stress and conflict.\n\nHowever, the drawbacks of this trend are, in my view, more serious. Firstly, living alone is expensive. A single person has to pay the full cost of rent, electricity and internet, whereas people who share a home can divide these costs. As more people choose to live alone, demand for small apartments rises, which pushes up housing prices in big cities. Secondly, and more importantly, people who live alone are at greater risk of loneliness, especially elderly people. Without anyone to talk to every day, they may become isolated, and if they fall ill or have an accident, nobody may notice for a long time.\n\nIn conclusion, while living alone can give people freedom and help them become more independent, I believe that the financial pressure and the risk of loneliness make this a largely negative development. Communities should therefore find ways to help people who live alone stay connected with others."
},
{

  ideas: ["digital entertainment", "academic pressure", "extra classes", "a lack of safe and accessible places", "physical education", "limit screen time", "green spaces", "an active lifestyle"],
  sample: "These days, many young people do not get enough physical activity, which can lead to health problems such as obesity and poor fitness. This essay will discuss the main causes of this problem and suggest some practical solutions.\n\nThe first cause is the popularity of digital entertainment. Many teenagers spend several hours a day playing video games, watching videos or using social media, and this time often replaces sports and outdoor activities. A second reason is academic pressure. In many Asian countries, including Vietnam, students spend long hours at school and in extra classes, so they have little time or energy left for exercise. Finally, in big cities there is a lack of safe and accessible places to play, as parks and sports fields are being replaced by buildings and roads.\n\nThere are several ways to tackle this problem. Schools could make physical education more enjoyable and more frequent, offering a wider range of activities such as dance, swimming or basketball, so that every student can find something they like. Parents also have an important role to play: they can limit their children's screen time and encourage family activities, such as cycling or walking together at the weekend. Finally, local governments should protect green spaces and build more free sports facilities, so that young people have convenient places to be active.\n\nIn conclusion, young people today exercise too little mainly because of digital entertainment, heavy study schedules and a lack of space. If schools, families and governments work together, it should be possible to encourage a more active lifestyle among the younger generation."

{

  sample: "In recent decades, international travel has grown rapidly, and many people now go abroad on holiday regularly. This essay will explain why this has happened and argue that, overall, it is a positive development for the countries tourists visit, as long as it is well managed.\n\nThere are two main reasons for the growth of international tourism. Firstly, travelling has become much cheaper and easier. Low-cost airlines offer affordable flights, and booking websites allow people to arrange flights and hotels in minutes. Secondly, rising incomes in many countries, especially in Asia, mean that more families can afford holidays abroad. Social media has also played a part, as people see attractive photos of foreign destinations and want to visit them too.\n\nFor the host countries, I believe tourism is mostly beneficial. The most important advantage is economic: tourists spend money on hotels, restaurants, transport and souvenirs, which creates jobs for local people. In Vietnam, for example, tourism has helped places such as Hoi An and Ha Long Bay to develop rapidly. Tourism can also encourage governments to protect historic buildings and natural areas, because these attract visitors. However, there are some negative effects. Too many visitors can damage the environment, increase prices for local residents and change traditional ways of life.\n\nIn conclusion, international tourism has increased mainly because travel is cheaper and people are wealthier. Although it can cause problems, I believe that it is a positive development for host countries, provided that governments control visitor numbers and protect local communities and the environment."

/* ---------- đọc to (Text-to-Speech) ---------- */
const TTS = {
  voices: [],
  load() {
    const v = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    if (v.length) this.voices = v;
  },
  pick(slot) {
    const want = slot === "B" ? U.voiceB : U.voiceA;
    let v = this.voices.find(x => x.name === want);
    if (v) return v;
    const F = /female|zira|libby|sonia|hazel|susan|aria|jenny|natasha|samantha|karen|serena|kate|moira|tessa|uk english female/i;
    const M = /male|david|george|ryan|guy|mark|daniel|james|arthur|oliver|uk english male|fred|alex/i;
    const gb = this.voices.filter(x => /GB/i.test(x.lang));
    const pool = gb.length ? [...gb, ...this.voices] : this.voices;
    if (slot === "B") v = pool.find(x => M.test(x.name) && !/female/i.test(x.name));
    else v = pool.find(x => F.test(x.name));
    return v || pool[0] || null;
  },
  say(text, opts = {}) {
    if (!("speechSynthesis" in window)) { toast("Trình duyệt này không hỗ trợ đọc to", "think"); return null; }
    if (!opts.queue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = this.pick(opts.slot || "A");
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
    u.rate = (opts.rate || U.rate || 1);
    const same = this.pick("A") === this.pick("B");
    u.pitch = opts.slot === "B" && same ? 0.75 : opts.slot === "C" ? 1.2 : 1;
    if (opts.onend) u.onend = opts.onend;
    if (opts.onstart) u.onstart = opts.onstart;
    TTS.cur = u;
    speechSynthesis.speak(u);
    return u;
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) {} }
};
if ("speechSynthesis" in window) { TTS.load(); speechSynthesis.onvoiceschanged = () => TTS.load(); }

/* ---------- ước lượng band từng kỹ năng từ kết quả ---------- */
function rawToBand(skill, correct, total) {
  const raw = Math.round(correct / total * 40);
  return lookupBand(skill === "listening" ? "L" : U.module === "general" ? "RG" : "RA", raw);

function skillEstimate(skill) {
  const res = Object.values(U.results[skill] || {});
  if (!res.length) return null;
  const last = res.sort((a, b) => b.at - a.at).slice(0, 3);
  const pct = last.reduce((s, r) => s + r.score / r.total, 0) / last.length;
  return lookupBand(skill === "listening" ? "L" : U.module === "general" ? "RG" : "RA", Math.round(pct * 40));
}
function selfBand(skill) { const r = U.results[skill]; if (!r) return null; const v = Object.values(r).sort((a, b) => b.at - a.at)[0]; return v ? v.band : null; }
const BANDS = {
  L: [[39, 9], [37, 8.5], [35, 8], [32, 7.5], [30, 7], [26, 6.5], [23, 6], [18, 5.5], [16, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3], [4, 2.5], [3, 2], [1, 1], [0, 0]],
  RA: [[39, 9], [37, 8.5], [35, 8], [33, 7.5], [30, 7], [27, 6.5], [23, 6], [19, 5.5], [15, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3], [4, 2.5], [0, 0]],
  RG: [[40, 9], [39, 8.5], [37, 8], [36, 7.5], [34, 7], [32, 6.5], [30, 6], [27, 5.5], [23, 5], [19, 4.5], [15, 4], [12, 3.5], [9, 3], [6, 2.5], [0, 0]]
};
function lookupBand(t, raw) { for (const [min, b] of BANDS[t]) if (raw >= min) return b; return 0; }
function overallBand(arr) {
  const a = arr.reduce((s, x) => s + x, 0) / arr.length;
  const f = a - Math.floor(a);
  return f < .25 ? Math.floor(a) : f < .75 ? Math.floor(a) + .5 : Math.floor(a) + 1;
