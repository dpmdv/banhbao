function quizHTML(set, opt = {}) {
  let n = opt.start || 0; const P = opt.prefix || "";
  return set.groups.map((g, gi) => {
    const size = g.type === "multi" ? g.qs.reduce((t, q) => t + q.a.length, 0) : g.qs.length;
    const from = n + 1, to = n + size;
    const head = `<div class="gi"><b>Questions ${from}${to > from ? "–" + to : ""}</b> · ${g.instr}</div>`;
    const body = g.qs.map((q, qi) => {
      const name = `${P}q${gi}_${qi}`;
      const num = g.type === "multi" ? `${n + 1}–${n + q.a.length}` : n + 1;
      n += g.type === "multi" ? q.a.length : 1;
      let inner = "";
      if (g.type === "tfng") {
        const labels = g.labels || ["TRUE", "FALSE", "NOT GIVEN"];
        inner = `<div class="qt">${q.q}</div><div class="tfng">${labels.map(l => `<label><input type="radio" name="${name}" value="${l}">${l}</label>`).join("")}</div>`;
      } else if (g.type === "mcq") {
        inner = `<div class="qt">${q.q}</div><div class="opts">${q.opts.map((o, oi) => `<label class="opt"><input type="radio" name="${name}" value="${oi}"><span><b>${"ABCDEFG"[oi]}</b>&nbsp; ${o}</span></label>`).join("")}</div>`;
      } else if (g.type === "multi") {
        inner = `<div class="qt">${q.q} <span class="tag">chọn ${q.a.length}</span></div><div class="opts">${q.opts.map((o, oi) => `<label class="opt"><input type="checkbox" name="${name}" value="${oi}"><span><b>${"ABCDEFG"[oi]}</b>&nbsp; ${o}</span></label>`).join("")}</div>`;
      } else if (g.type === "gap") {
        inner = `<div class="qt">${q.q.replace("___", `<input class="gapin" name="${name}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" placeholder="${n}">`)}</div>`;
      } else if (g.type === "match") {
        inner = `<div class="qt">${q.q} &nbsp;<select class="inp" style="width:auto;display:inline-block;padding:3px 8px" name="${name}"><option value="">—</option>${g.options.map((o, oi) => `<option value="${oi}">${esc(o.split(" ")[0])}</option>`).join("")}</select></div>`;
      }
      return `<div class="q" data-q="${name}"><span class="qn" style="${g.type === "multi" ? "width:auto;padding:0 5px;min-width:26px" : ""}">${num}</span><div>${inner}<div class="exslot"></div></div></div>`;
    }).join("");
    const list = g.type === "match" && !g.noList ? `<div class="card sunk" style="padding:10px 12px;gap:3px;font-family:var(--read);font-size:13px">${g.options.map(o => `<div>${esc(o)}</div>`).join("")}</div>` : "";
    return `<div class="qgroup">${head}${g.html ? `<div class="qhtml">${g.html}</div>` : ""}${list}${body}</div>`;
  }).join("");
}
const norm = s => String(s || "").toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9'%.$£ -]/g, " ").replace(/\s+/g, " ").trim().replace(/^(the|a|an) /, "");
const kindOf = g => g.kind || ({ tfng: (g.labels || [])[0] === "YES" ? "YES / NO / NOT GIVEN" : "TRUE / FALSE / NOT GIVEN", mcq: "Trắc nghiệm 1 đáp án", multi: "Chọn nhiều đáp án", gap: "Điền từ (completion)", match: "Nối thông tin (matching)" })[g.type];
function checkQuiz(set, root, skill, P = "") {
  let score = 0, total = 0;
  const stat = {};
  set.groups.forEach((g, gi) => g.qs.forEach((q, qi) => {
    const name = `${P}q${gi}_${qi}`, box = $(`[data-q="${name}"]`, root);
    let ok = false, right = "", pts = 0, max = 1;
    if (g.type === "tfng") {
      const v = ($(`input[name="${name}"]:checked`, root) || {}).value;
      ok = v === q.a; right = q.a;
      $$(`input[name="${name}"]`, root).forEach(i => i.parentElement.classList.toggle("right", i.value === q.a));
    } else if (g.type === "mcq") {
      const v = ($(`input[name="${name}"]:checked`, root) || {}).value;
      ok = +v === q.a && v != null; right = "ABCDEFG"[q.a];
      $$(`input[name="${name}"]`, root).forEach(i => { i.closest(".opt").classList.toggle("right", +i.value === q.a); i.closest(".opt").classList.toggle("wrong", i.checked && +i.value !== q.a); });
    } else if (g.type === "multi") {
      max = q.a.length;
      const picked = $$(`input[name="${name}"]:checked`, root).map(i => +i.value);
      const hit = picked.filter(x => q.a.includes(x)).length;
      pts = Math.max(0, hit - Math.max(0, picked.length - max));
      ok = pts === max; right = q.a.map(i => "ABCDEFG"[i]).join(", ");
      $$(`input[name="${name}"]`, root).forEach(i => { i.closest(".opt").classList.toggle("right", q.a.includes(+i.value)); i.closest(".opt").classList.toggle("wrong", i.checked && !q.a.includes(+i.value)); });
    } else if (g.type === "gap") {
      const v = norm($(`[name="${name}"]`, root).value);
      ok = !!v && q.a.some(a => norm(a) === v || norm(a).replace(/ /g, "") === v.replace(/ /g, "")); right = q.a.join(" / ");
    } else if (g.type === "match") {
      const v = $(`[name="${name}"]`, root).value;
      ok = v !== "" && +v === q.a; right = g.options[q.a];
    }
    if (g.type !== "multi") pts = ok ? 1 : 0;
    score += pts; total += max;
    const k = kindOf(g); stat[k] = stat[k] || { c: 0, t: 0 }; stat[k].c += pts; stat[k].t += max;
    box.classList.toggle("ok", ok); box.classList.toggle("no", !ok);
    $(".exslot", box).innerHTML = `<div class="expl">${ok ? "Đúng rồi! " : g.type === "multi" ? `Đúng ${pts}/${max}. Đáp án: <b>${esc(right)}</b>. ` : `Đáp án: <b>${esc(right)}</b>. `}${q.ex || ""}</div>`;
  }));
  if (skill) {
    U.qstat = U.qstat || {};
    Object.entries(stat).forEach(([k, v]) => { const key = skill + "|" + k; const o = U.qstat[key] || { c: 0, t: 0 }; o.c += v.c; o.t += v.t; U.qstat[key] = o; });
  }
  return { score, total };
}
const qCount = set => set.groups.reduce((s, g) => s + (g.type === "multi" ? g.qs.reduce((t, q) => t + q.a.length, 0) : g.qs.length), 0);
const tipsHTML = (arr, c) => `<section><div class="sec-h c-${c}">${ic("bulb")}<span>Chiến thuật theo từng dạng câu</span><span class="spacer"></span><span class="tiny">chạm để mở</span></div><div class="tips">${arr.map(t => `<details class="card tipcard c-${c}"><summary><b>${t[0]}</b><span class="tiny">${t[1]}</span></summary><div class="lesson">${t[2]}</div></details>`).join("")}</div></section>`;
function resultHTML(c, score, total, band, extra = "") {

function startCountdown(min, el, onEnd) {

}

function dictationView() {
  return `<div class="row"><button class="back" data-nav="listening">${ic("left")} Listening</button></div>
  ${pageHead("P", "edit", "Chép chính tả", "Bấm nghe, gõ lại cả câu rồi Enter. Chữ xanh là đúng, chữ đỏ gạch là thiếu/sai. Nghe chậm bao nhiêu lần cũng được. Không cần quan tâm hoa/thường và dấu câu.")}
  <div class="words c-P" id="dlist">${DICTATION.map((s, i) => `<div class="word" style="grid-template-columns:auto minmax(0,1fr) auto" data-d="${i}">
    <div class="row" style="gap:4px"><span class="qn">${i + 1}</span><button class="iconbtn" data-dplay="${i}" title="Nghe">${ic("vol")}</button><button class="btn sm ghost" data-dslow="${i}" title="Nghe chậm">0.7×</button></div>
    <div><input class="inp" data-din="${i}" placeholder="Gõ câu bạn nghe được…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" style="font-family:var(--read)"><div class="dout tiny mt" style="font-family:var(--read);font-size:13px"></div></div>
    <button class="btn sm" data-dchk="${i}">Kiểm tra</button></div>`).join("")}</div>
  <div class="row"><span class="tiny" id="dscore"></span></div>`;
}
function dictationMount() {
  const res = {};
  const check = i => {
    const target = DICTATION[i], got = $(`[data-din="${i}"]`).value;
    const tw = norm(target).replace(/[.,]/g, "").split(" "), gw = norm(got).replace(/[.,]/g, "").split(" ").filter(Boolean);
    // so khớp LCS để biết từ nào đúng
    const m = tw.length, n = gw.length, dp = [...Array(m + 1)].map(() => Array(n + 1).fill(0));
    for (let a = m - 1; a >= 0; a--) for (let b = n - 1; b >= 0; b--) dp[a][b] = tw[a] === gw[b] ? dp[a + 1][b + 1] + 1 : Math.max(dp[a + 1][b], dp[a][b + 1]);
    let a = 0, b = 0; const hit = new Set();
    while (a < m && b < n) { if (tw[a] === gw[b]) { hit.add(a); a++; b++; } else if (dp[a + 1][b] >= dp[a][b + 1]) a++; else b++; }
    const words = target.split(" ");
    $(`[data-d="${i}"] .dout`).innerHTML = words.map((w, k) => `<span style="color:${hit.has(k) ? "var(--good)" : "var(--bad)"};${hit.has(k) ? "" : "text-decoration:underline wavy"}">${esc(w)}</span>`).join(" ");
    res[i] = Math.round(hit.size / tw.length * 100);
    const vals = Object.values(res), avg = Math.round(vals.reduce((s, x) => s + x, 0) / vals.length);
    $("#dscore").textContent = `Đã làm ${vals.length}/${DICTATION.length} câu · đúng trung bình ${avg}% số từ`;
    if (vals.length >= 5) { U.results.dict = { best: Math.max(avg, (U.results.dict || {}).best || 0), at: Date.now() }; save(); }
    markActive();
  };
  $("#dlist").addEventListener("click", e => {
    const p = e.target.closest("[data-dplay]"), sl = e.target.closest("[data-dslow]"), c = e.target.closest("[data-dchk]");
    if (p) TTS.say(DICTATION[p.dataset.dplay], { slot: p.dataset.dplay % 2 ? "B" : "A" });
    if (sl) TTS.say(DICTATION[sl.dataset.dslow], { rate: .7, slot: sl.dataset.dslow % 2 ? "B" : "A" });
    if (c) check(+c.dataset.dchk);
  });
  $("#dlist").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset.din) check(+e.target.dataset.din); });
}

function writingCheck(text, t) {

  const LINK = ["however", "moreover", "furthermore", "in addition", "on the other hand", "therefore", "as a result", "for example", "for instance", "in conclusion", "overall", "although", "whereas", "while", "consequently", "firstly", "secondly", "finally", "nevertheless", "in contrast", "similarly", "by contrast", "to sum up", "this means", "because of", "due to", "such as"];
  const used = LINK.filter(l => low.includes(" " + l + " ") || low.includes(" " + l + ","));
  if (used.length < 4) add("warn", `Ít từ nối (${used.length}): ${used.join(", ") || "chưa có"}. Thêm vài từ như <i>however, moreover, for example, as a result</i>.`);
  else add("good", `Dùng ${used.length} từ nối: ${used.slice(0, 8).join(", ")}${used.length > 8 ? "…" : ""}.`);
  const contr = text.match(/\b(\w+n't|it's|I'm|I've|they're|we're|you're|that's|there's|let's|won't|can't)\b/gi) || [];
  if (contr.length) add("bad", `Có từ viết tắt (${[...new Set(contr)].slice(0, 5).join(", ")}). Văn viết học thuật nên viết đầy đủ: <i>do not, it is, cannot</i>…`);
  const INF = { "a lot of": "a large number of / a great deal of", "lots of": "many / numerous", "kids": "children", "stuff": "things → nêu cụ thể", "gonna": "going to", "wanna": "want to", "really": "(bỏ đi hoặc dùng extremely)", "big": "significant / substantial", "get": "obtain / become / receive", "good": "beneficial / positive", "bad": "harmful / negative" };

  if (inf.length) add("warn", `Từ hơi thông dụng/văn nói: ${inf.slice(0, 6).map(k => `<b>${k.replace(",", "")}</b> → ${INF[k]}`).join("; ")}.`);
  const STOP = new Set("the a an and or but of to in on at for with is are was were be been being it this that these those as by from which who people their there they them its can will would should could have has had more most than also not such into about many much very some other because if so do does did may might our we you your his her he she i my me one two".split(" "));

function renderChart(c) {
  const PAL = ["#FF5C93", "#2F9BEA", "#18A874", "#F2A900", "#8E5CF7"];
  const W = 640, H = 300, L = 54, B = 40, T = 26, Rr = 16;
  const legend = (names) => `<g font-size="11">${names.map((n, i) => `<rect x="${L + i * 150}" y="6" width="12" height="12" rx="3" fill="${PAL[i]}"/><text x="${L + i * 150 + 18}" y="16" fill="currentColor">${esc(n)}</text>`).join("")}</g>`;
  if (c.type === "process") {
    return `<p class="tiny" style="font-weight:600;color:var(--ink)">${esc(c.title)}</p><div class="proc en">${c.steps.map((s, i) => `<div class="pstep"><span class="pn">${i + 1}</span><b>${esc(s[0])}</b><small>${esc(s[1])}</small></div>${i < c.steps.length - 1 ? `<span class="parr">→</span>` : ""}`).join("")}</div>`;
  }
  if (c.type === "table") {
    return `<div style="overflow:auto"><p class="tiny" style="margin-bottom:6px;font-weight:600;color:var(--ink)">${esc(c.title)}</p><table class="tbl en"><tr>${c.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>${c.rows.map(r => `<tr>${r.map((x, i) => `<td class="${i ? "n" : ""}">${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  }
  if (c.type === "pie") {
    return `<p class="tiny" style="font-weight:600;color:var(--ink)">${esc(c.title)}</p><div class="row" style="justify-content:center;gap:24px">${c.pies.map(p => {
      let a = -Math.PI / 2; const R0 = 80, cx = 95, cy = 95;
      const segs = p.vals.map((v, i) => { const a2 = a + v / 100 * Math.PI * 2; const big = a2 - a > Math.PI ? 1 : 0; const x1 = cx + R0 * Math.cos(a), y1 = cy + R0 * Math.sin(a), x2 = cx + R0 * Math.cos(a2), y2 = cy + R0 * Math.sin(a2); const mid = (a + a2) / 2; const s = `<path d="M${cx} ${cy}L${x1} ${y1}A${R0} ${R0} 0 ${big} 1 ${x2} ${y2}Z" fill="${PAL[i]}" stroke="var(--surface)" stroke-width="2"/><text x="${cx + 55 * Math.cos(mid)}" y="${cy + 55 * Math.sin(mid) + 4}" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">${v}%</text>`; a = a2; return s; }).join("");
      return `<svg viewBox="0 0 190 215" style="width:200px">${segs}<text x="95" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${esc(p.name)}</text></svg>`;
    }).join("")}</div><div class="row" style="justify-content:center">${c.labels.map((l, i) => `<span class="tiny"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${PAL[i]}"></span> ${esc(l)}</span>`).join("")}</div>`;
  }
  const max = c.max || Math.max(...c.series.flatMap(s => s.vals)) * 1.1;
  const ticks = 5, pw = W - L - Rr, ph = H - T - B;
  const y = v => T + ph - v / max * ph;
  const grid = [...Array(ticks + 1)].map((_, i) => { const v = max / ticks * i; return `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".12"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".7">${Math.round(v * 10) / 10}</text>`; }).join("");
  const n = c.x.length;
  let marks = "";
  if (c.type === "line") {
    const x = i => L + pw * (i / (n - 1));
    marks = c.series.map((s, si) => `<polyline fill="none" stroke="${PAL[si]}" stroke-width="2.5" points="${s.vals.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>${s.vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${PAL[si]}"/>`).join("")}`).join("")
      + c.x.map((l, i) => `<text x="${x(i)}" y="${H - B + 16}" text-anchor="middle" font-size="10.5" fill="currentColor">${esc(l)}</text>`).join("");
  } else {
    const gw = pw / n, bw = Math.min(28, gw * .8 / c.series.length);
    marks = c.x.map((l, i) => {
      const cx = L + gw * i + gw / 2, start = cx - bw * c.series.length / 2;
      return c.series.map((s, si) => `<rect x="${start + si * bw}" y="${y(s.vals[i])}" width="${bw - 2}" height="${T + ph - y(s.vals[i])}" rx="3" fill="${PAL[si]}"/>`).join("") + `<text x="${cx}" y="${H - B + 16}" text-anchor="middle" font-size="10.5" fill="currentColor">${esc(l)}</text>`;
    }).join("");
  }
  return `<p class="tiny" style="font-weight:600;color:var(--ink)">${esc(c.title)}</p><svg class="chart" viewBox="0 0 ${W} ${H}" style="color:var(--ink)">${legend(c.series.map(s => s.name))}${grid}${marks}<text x="12" y="${T + ph / 2}" font-size="10.5" fill="currentColor" transform="rotate(-90 12 ${T + ph / 2})" text-anchor="middle">${esc(c.unit || "")}</text></svg>`;
}

/* ================== SPEAKING ================== */
const REC = { mr: null, chunks: [], stream: null, rec: null, final: "", t0: 0, tick: null, url: null, on: false };
REC.noMic = !!(window.claude && window.claude.use) || !(navigator.mediaDevices && window.MediaRecorder);
REC.swStart = function (box) {
  this.box = box; clearInterval(this.swT); this.t0 = Date.now(); this.swOn = true;
  const b = $("[data-sw]", box); if (b) b.innerHTML = `${ic("stop")} Dừng`;
  this.swT = setInterval(() => { const el = $(".rtime", box); if (el) { const s = Math.floor((Date.now() - this.t0) / 1000); el.textContent = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; } }, 500);
};
REC.swStop = function () { if (!this.swOn) return; this.swOn = false; clearInterval(this.swT); const b = this.box && $("[data-sw]", this.box); if (b) b.innerHTML = `${ic("timer")} Bấm giờ trả lời`; markActive(); };
REC.start = async function (box) {
  if (this.noMic) { this.swStart(box); return false; }
  if (this.on) this.stop(true);
  this.box = box; this.final = ""; this.chunks = []; this.srErr = "";
  try {
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    this.mr = new MediaRecorder(this.stream);
    this.mr.ondataavailable = e => e.data.size && this.chunks.push(e.data);
    this.mr.onstop = () => { const b = new Blob(this.chunks, { type: this.mr.mimeType || "audio/webm" }); if (this.url) URL.revokeObjectURL(this.url); this.url = URL.createObjectURL(b); this.paint(true); };
    this.mr.start();
  } catch (e) { this.noMic = true; box.outerHTML = recBox(); toast("Không mở được micro, chuyển sang ghi bằng app Ghi âm nha", "think"); return false; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    try {
      this.rec = new SR(); this.rec.lang = "en-US"; this.rec.continuous = true; this.rec.interimResults = true;
      this.rec.onresult = ev => { let interim = ""; for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) this.final += r[0].transcript + " "; else interim += r[0].transcript; } this.paintText(interim); };
      this.rec.onend = () => { if (this.on) try { this.rec.start(); } catch (e) {} };
      this.rec.onerror = ev => { this.srErr = ev.error; if (ev.error === "not-allowed" || ev.error === "service-not-allowed") this.on && (this.rec = null); };
      this.rec.start();
    } catch (e) { this.rec = null; }
  }
  this.on = true; this.t0 = Date.now();
  this.tick = setInterval(() => { const el = $(".rtime", this.box); if (el) { const s = Math.floor((Date.now() - this.t0) / 1000); el.textContent = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; } }, 500);
  this.paint(false);
  return true;
};
REC.stop = function (silent) {
  if (this.noMic) { this.swStop(); return; }
  if (!this.on) return;
  this.on = false; clearInterval(this.tick); this.dur = (Date.now() - this.t0) / 1000;
  try { this.rec && this.rec.stop(); } catch (e) {}
  try { this.mr && this.mr.state !== "inactive" && this.mr.stop(); } catch (e) {}
  this.stream && this.stream.getTracks().forEach(t => t.stop());
  if (!silent) markActive();
};
REC.paintText = function (interim = "") {
  const el = $(".transcript", this.box); if (!el) return;
  const hl = s => esc(s).replace(/\b(um+|uh+|er+|erm|ah+|you know|like|i mean)\b/gi, '<span class="filler">$1</span>');
  el.innerHTML = (this.final ? hl(this.final) : "") + (interim ? `<span class="interim">${esc(interim)}</span>` : "") || `<span class="interim">Đang nghe… (máy sẽ ghi lại những gì bạn nói)</span>`;
};
REC.paint = function (done) {
  const b = this.box; if (!b) return;
  if (!done) {
    $(".rctl", b).innerHTML = `<span class="recdot"></span><b class="rtime">00:00</b><span class="spacer"></span><button class="btn rec" data-recstop>${ic("stop")} Dừng</button>`;
    $(".rout", b).innerHTML = `<div class="transcript"><span class="interim">${(window.SpeechRecognition || window.webkitSpeechRecognition) ? "Đang nghe… (chữ sẽ hiện ở đây khi bạn nói)" : "Trình duyệt này không chuyển giọng nói thành chữ, nhưng vẫn ghi âm được. Dùng Chrome/Edge để có thêm phần này."}</span></div>`;
    return;
  }
  const words = countWords(this.final), wpm = this.dur ? Math.round(words / (this.dur / 60)) : 0;
  const fillers = (this.final.match(/\b(um+|uh+|er+|erm|ah+)\b/gi) || []).length;
  const uniq = new Set((this.final.toLowerCase().match(/[a-z']+/g) || [])).size;
  $(".rctl", b).innerHTML = `<audio controls src="${this.url}" style="flex:1;min-width:200px;height:36px"></audio><button class="btn" data-recstart>${ic("rec")} Ghi lại</button><a class="btn" href="${this.url}" download="speaking-${todayKey()}.webm">${ic("down")}</a>`;
  if (this.final.trim()) {
    $(".rout", b).innerHTML = `<div class="transcript en">${esc(this.final)}</div>
    <div class="wstat"><span>Thời lượng <b>${Math.round(this.dur)}s</b></span><span>Số từ <b>${words}</b></span><span>Tốc độ <b>${wpm}</b> từ/phút ${wpm && wpm < 90 ? "(hơi chậm, band 6 thường ~110–150)" : wpm > 170 ? "(hơi nhanh)" : ""}</span><span>Từ khác nhau <b>${uniq}</b></span><span>Từ đệm (um/uh) <b style="color:${fillers > 3 ? "var(--bad)" : "var(--ink)"}">${fillers}</b></span></div>
    <p class="tiny">Phần chữ là máy nghe lại, có thể sai vài chỗ. Nếu máy nghe sai nhiều từ, đó là dấu hiệu nên luyện thêm phát âm những từ đó.</p>`;
  } else $(".rout", b).innerHTML = (this.srErr ? `<p class="tiny">Máy chưa chép được lời nói (${esc(this.srErr)}). Tính năng này cần Chrome hoặc Edge và có mạng; bản ghi âm vẫn dùng bình thường.</p>` : "") + `<p class="tiny">Nghe lại bản ghi để tự nhận xét: có ngập ngừng nhiều không, phát âm đuôi -s/-ed rõ chưa, ý có phát triển đủ không.</p>`;
};
const recBox = (hint = "") => REC.noMic ? `<div class="recbox" id="recbox">
  <div class="row">${ic("mic")}<b>Ghi âm bằng app Ghi âm của iPad</b></div>
  <p class="tiny" style="line-height:1.6">Trang web không mở được micro. Mở app <b>Ghi âm</b> (Voice Memos), bấm nút đỏ rồi trả lời. Ghi xong thì bấm <b>Mở bản ghi</b>, chọn tệp vừa ghi để nghe lại ngay tại đây. Có thể chia đôi màn hình iPad (Split View) để vừa xem câu hỏi vừa ghi.</p>
  <div class="row"><button class="btn" data-sw>${ic("timer")} Bấm giờ trả lời</button><b class="rtime timerchip">00:00</b><span class="spacer"></span><label class="btn pri" style="background:var(--cS);border-color:var(--cS)">${ic("vol")} Mở bản ghi<input type="file" accept="audio/*,video/*,.m4a" hidden data-recfile></label></div>

document.addEventListener("change", e => {

document.addEventListener("click", async e => {

/* ================== NHẬP BÀI ĐỌC ==================
   Người học tự dán đoạn văn + câu hỏi + đáp án (từ sách, trang luyện đề…) để làm ngay trong web.
   Bài nhập chỉ lưu trên máy người học (U.imported). */
U.imported = U.imported || [];
const impFind = id => (U.imported || []).find(x => x.id === id);
const IMP_ALIAS = { T: "TRUE", F: "FALSE", NG: "NOT GIVEN", Y: "YES", N: "NO", "NOTGIVEN": "NOT GIVEN" };
const impNorm = s => { let v = String(s || "").toUpperCase().replace(/[’']/g, "'").replace(/[.,;:!?"“”]/g, " ").replace(/\s+/g, " ").trim(); return IMP_ALIAS[v.replace(/ /g, "")] || IMP_ALIAS[v] || v; };
/* "1. TRUE" · "2) B" · "3 river / rivers" · "4-5 B, D" (bỏ qua dòng trống) */
function impParseKey(txt) {
  const out = [];
  String(txt || "").split(/\n/).forEach(line => {
    const m = line.trim().match(/^(?:q(?:uestion)?\s*)?(\d{1,2})\s*(?:[-–]\s*(\d{1,2}))?\s*[.):\-–]?\s+(.+)$/i);
    if (!m) return;
    const a = +m[1], b = m[2] ? +m[2] : a, ans = m[3].trim();
    if (b > a) { const parts = ans.split(/[,&]|\band\b/i).map(s => s.trim()).filter(Boolean); for (let n = a; n <= b; n++) out.push({ n, ans: [parts[n - a] || parts[0]] }); }
    else out.push({ n: a, ans: ans.split(/\s*\/\s*|\s+OR\s+/i).map(s => s.trim()).filter(Boolean) });
  });
  return out.sort((x, y) => x.n - y.n);
}
function impParas(txt) {
  return String(txt || "").replace(/\r/g, "").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => {
    const m = p.match(/^([A-Z])[\s.)]\s*([\s\S]+)$/);
    return m && m[2].length > 40 ? [m[1], m[2]] : ["", p];
  });
}

const BOX_DAYS = [0, 1, 2, 4, 7, 15, 30];

}

/* ---------- tra nhanh: chọn chữ trong bài (chuột hoặc chạm giữ trên iPad) ---------- */
async function quickPop(w, x, y) {
  $$(".pop,.selbar").forEach(p => p.remove());
  const p = document.createElement("div"); p.className = "pop";
  p.style.left = Math.min(x, innerWidth - 340) + "px"; p.style.top = Math.min(y + 14, innerHeight - 220) + "px";
  const loc = findLocal(w);
  const paint = on => {
    const en = on && on.en; const ph = en ? (en.flatMap(e => e.phonetics || []).find(q => q.text) || {}).text : "";
    const def = en ? en[0].meanings[0] : null;
    const vi = loc ? loc.mean : on && on.vi;
    p.innerHTML = `<div class="row"><span class="pw en">${esc(loc ? loc.w : w)}</span><span class="ipa" style="font-size:12px">${esc(ph || "")}</span><span class="spacer"></span>${sayBtn(loc ? loc.w : w)}<button class="iconbtn" data-closepop>${ic("x")}</button></div>
      ${vi ? `<div style="font-weight:600">${esc(vi)}</div>` : ""}
      ${def ? `<div class="pd en"><span class="pos" style="margin:0 6px 0 0">${esc(def.partOfSpeech)}</span>${esc(def.definitions[0].definition)}</div>` : on ? "" : `<div class="tiny">Đang tra…</div>`}
      <div class="row">${saveBtn([loc ? loc.w : w, "", vi || "", loc ? loc.ex : ""], "Tra nhanh").replace('class="iconbtn"', 'class="btn sm"').replace("</svg>", "</svg> Lưu")}<button class="btn sm" data-lookup="${esc(w)}">Xem đầy đủ ${ic("right")}</button></div>`;
  };
  paint(null); document.body.appendChild(p);
  paint(await lookupOnline(w));
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-closepop]")) { $$(".pop").forEach(p => p.remove()); return; }
  if (!e.target.closest(".pop") && !e.target.closest(".selbar") && !e.target.closest("mark.hl")) $$(".pop,.selbar").forEach(p => p.remove());
});
// Thanh công cụ hiện BÊN DƯỚI đoạn chọn, để không đè lên menu Sao chép/Tra cứu của iPad (hiện phía trên)
let selT, barBusy = false;
function showSelbar(range, txt, mark) {
  $$(".selbar").forEach(p => p.remove());
  const r = (mark || range).getBoundingClientRect();
  const bar = document.createElement("div"); bar.className = "selbar";
  const W = 260, left = Math.min(Math.max(8, r.left + r.width / 2 - W / 2), innerWidth - W - 8);
  const top = r.bottom + 12 + 44 > innerHeight ? Math.max(8, r.top - 56) : r.bottom + 12;
  bar.style.left = left + "px"; bar.style.top = top + "px";
  bar.innerHTML = mark ? `<button data-unhl>${ic("x")} Bỏ tô sáng</button><button data-sp>${ic("vol")} Đọc</button>`
    : `<button data-hl>${ic("hl")} Tô sáng</button>${txt.split(/\s+/).length <= 3 ? `<button data-qk>${ic("search")} Tra</button>` : ""}<button data-sp>${ic("vol")} Đọc</button>`;
  bar.addEventListener("pointerdown", ev => { barBusy = true; ev.preventDefault(); });
  bar.onclick = ev => {
    if (ev.target.closest("[data-hl]")) { try { const m = document.createElement("mark"); m.className = "hl"; range.surroundContents(m); } catch (er) { toast("Tô sáng trong một đoạn thôi nha", "think"); } }
    if (ev.target.closest("[data-unhl]")) mark.replaceWith(...mark.childNodes);
    if (ev.target.closest("[data-qk]")) quickPop(txt.replace(/[^A-Za-z' -]/g, "").trim(), r.left, r.bottom);
    if (ev.target.closest("[data-sp]")) TTS.say(txt);
    bar.remove(); barBusy = false; try { window.getSelection().removeAllRanges(); } catch (er) {}
  };
  document.body.appendChild(bar);
}
document.addEventListener("selectionchange", () => {
  clearTimeout(selT);
  selT = setTimeout(() => {
    if (barBusy) return;
    const sel = window.getSelection(); const txt = sel ? sel.toString().trim() : "";
    if (!txt || txt.length < 2 || txt.length > 400 || !sel.rangeCount) { if (!$(".selbar [data-unhl]")) $$(".selbar").forEach(p => p.remove()); return; }
    const range = sel.getRangeAt(0);
    const host = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
    if (!host || !host.closest(".passage,.script,.sample,.cue,.qt,.ex,.fe") || host.closest("input,textarea")) return;
    showSelbar(range.cloneRange(), txt);
  }, 380);
});
document.addEventListener("click", e => {
  const m = e.target.closest("mark.hl");
  if (m && !window.getSelection().toString()) { e.stopPropagation(); showSelbar(null, m.textContent, m); }
});

}

/* ================== THI THỬ MÔ PHỎNG IELTS ==================
   Thứ tự như thi thật: Listening (~30') → Reading (60') → Writing (60') → Speaking (11–14').
   Bài làm tự lưu trong U.exam, tải lại trang vẫn thi tiếp. */
const findL = id => LISTENING.find(x => x.id === id) || MOCK_LISTENING.find(x => x.id === id);
const findR = id => READING.find(x => x.id === id) || MOCK_READING.find(x => x.id === id);
const findW = id => [...WRITING.task1, ...WRITING.task2, ...MOCK_WRITING].find(x => x.id === id);
const SEC_NAME = { L: "Listening", R: "Reading", W: "Writing", S: "Speaking" };
const SEC_INFO = {
  L: "4 phần, khoảng 40 câu. Mỗi phần có 30 giây đọc trước câu hỏi, bài nghe phát <b>một lần duy nhất</b>. Sau phần 4 có 2 phút kiểm tra lại.",
  R: "3 bài đọc, khoảng 40 câu, <b>60 phút</b>. Chuyển bài đọc bằng các nút Passage ở dưới. Hết giờ máy tự nộp.",
  W: "Task 1 (≥150 từ) và Task 2 (≥250 từ) trong <b>60 phút</b>. Nên dành 20 phút cho Task 1 và 40 phút cho Task 2.",
  S: "Khoảng 11–14 phút: Part 1 hỏi đáp, Part 2 nói 2 phút theo thẻ, Part 3 thảo luận. Máy đọc câu hỏi, bạn trả lời thành tiếng."
};
let EX = { tick: null, lp: null };
const exSave = () => save();
function mockDone(mid) { return U.mocks.filter(m => m.mid === mid); }

/* ---------- trang danh sách đề ---------- */

      <div class="foot"><span>${done.length ? `Đã thi ${done.length} lần` : "Chưa thi"}</span>${last && last.O ? `<span class="score">Overall ${last.O.toFixed(1)}</span>` : ""}</div>

      : `<div class="empty">${bbMascot("think")}<p>Chưa có lần thi thử nào. Làm Đề thi thử 1 để biết trình độ hiện tại của mình nhé.</p></div>`}
  </section>
  ${weakHTML()}
  <details class="card"><summary style="cursor:pointer"><b>Ghi điểm đề làm ngoài app</b> <span class="tiny">(ví dụ sách Cambridge IELTS)</span></summary>
    <div class="fields" style="margin-top:10px">
      <div class="field"><label>Listening: số câu đúng /40</label><input class="inp" type="number" min="0" max="40" id="xL"></div>
      <div class="field"><label>Reading: số câu đúng /40</label><input class="inp" type="number" min="0" max="40" id="xR"></div>
      <div class="field"><label>Writing (band)</label><input class="inp" type="number" step=".5" min="0" max="9" id="xW"></div>

      <div class="field full"><label>Tên đề</label><input class="inp" id="xN" placeholder="Cambridge 18 – Test 2"></div></div>
    <div class="row" style="margin-top:8px"><span class="spacer"></span><button class="btn pri" id="xSave">${ic("plus")} Lưu kết quả</button></div></details>`;
};
VIEWS.mock_mount = () => {
  $$("[data-exstart]").forEach(b => b.onclick = () => examIntro(b.dataset.exstart, b.dataset.secs.split("")));
  $$("[data-expart]").forEach(b => b.onclick = () => {
    const m = MOCKS.find(x => x.id === b.dataset.expart), t = { L: "~32 phút · 4 phần nghe", R: "60 phút · 3 bài đọc", W: "60 phút · Task 1 + Task 2", S: "11–14 phút · Part 1–3" }, icn = { L: "head", R: "book", W: "pen", S: "mic" };
    modal(`<div class="row"><h3>${esc(m.name)} · thi từng phần</h3><span class="spacer"></span><button class="iconbtn" data-close>${ic("x")}</button></div>
      <div class="ilist">${["L", "R", "W", "S"].map(s => `<button class="irow" data-pickpart="${s}"><span class="isq c-${s}">${ic(icn[s])}</span><span class="ibody"><span class="itx"><b>${SEC_NAME[s]}</b><small>${t[s]}</small></span><span class="ichev">${ic("right")}</span></span></button>`).join("")}</div>`, (bx, close) => {
      $$("[data-pickpart]", bx).forEach(r => r.onclick = () => { close(); examIntro(m.id, [r.dataset.pickpart]); });

  const r = $("#exResume"); if (r) r.onclick = () => examOpen();
  const q = $("#exQuit"); if (q) q.onclick = () => modal(`<h3>Hủy bài thi đang làm?</h3><p class="k">Bài làm dở sẽ bị xóa.</p><div class="row"><span class="spacer"></span><button class="btn" data-close>Thôi</button><button class="btn danger" id="qy">Hủy bài</button></div>`, (bx, close) => { $("#qy", bx).onclick = () => { U.exam = null; save(); close(); renderMain(); }; });
  $$("[data-mdel]").forEach(b => b.onclick = () => { U.mocks.splice(+b.dataset.mdel, 1); save(); renderMain(); });
  $$("[data-exrev]").forEach(b => b.onclick = () => examReview(U.mocks[+b.dataset.exrev]));
  $("#xSave").onclick = () => {
    const L = $("#xL").value, Rr = $("#xR").value, W = $("#xW").value, S = $("#xS").value;
    const row = { d: todayKey(), mid: "ext", n: $("#xN").value || "Đề ngoài", raw: {} };
    if (L !== "") { row.L = lookupBand("L", Math.min(40, +L)); row.raw.L = L + "/40"; }
    if (Rr !== "") { row.R = lookupBand(U.module === "general" ? "RG" : "RA", Math.min(40, +Rr)); row.raw.R = Rr + "/40"; }
    if (W !== "") row.W = +W; if (S !== "") row.S = +S;
    if ([row.L, row.R, row.W, row.S].every(x => x != null)) row.O = overallBand([row.L, row.R, row.W, row.S]);
    U.mocks.push(row); markActive(); save(); renderMain(); toast("Đã lưu kết quả");
  };
};

/* ---------- màn hình bắt đầu ---------- */
function examIntro(mid, secs) {
  const m = MOCKS.find(x => x.id === mid);
  const mins = { L: 32, R: 60, W: 60, S: 14 };
  modal(`<div class="row">${bbMascot("study").replace('class="bbm"', 'class="bbm" style="width:64px;height:64px"')}<div><h3>${esc(m.name)}</h3><p class="k">${secs.map(s => SEC_NAME[s]).join(" → ")} · khoảng ${secs.reduce((t, s) => t + mins[s], 0)} phút</p></div></div>
    <div class="lesson">${secs.map(s => `<p><b>${SEC_NAME[s]}:</b> ${SEC_INFO[s]}</p>`).join("")}
    <div class="warn">Như thi thật: không xem đáp án giữa chừng, không quay lại phần đã nộp. Đeo tai nghe, ngồi chỗ yên tĩnh. Bài làm tự lưu nếu lỡ thoát ra.</div></div>
    <div class="row"><span class="spacer"></span><button class="btn" data-close>Để sau</button><button class="btn pri" id="exGo">${ic("play")} Vào phòng thi</button></div>`, (bx, close) => {
    $("#exGo", bx).onclick = () => {
      U.exam = { mid, secs, si: 0, sec: secs[0], ans: {}, w: {}, res: {}, started: Date.now() };
      save(); close(); examEnterSection();
    };
  });
}
function examEnterSection() {
  const e = U.exam; e.sec = e.secs[e.si];
  e.part = 0; e.phase = e.sec === "L" ? "ready" : "run";
  e.endsAt = e.sec === "R" || e.sec === "W" ? Date.now() + 60 * 60 * 1000 : null;
  save(); examOpen();
}

/* ---------- khung phòng thi ---------- */
var examOpen = function () {
  if (!U.exam) return;
  $$("#exam").forEach(x => x.remove());
  const ov = document.createElement("div"); ov.id = "exam"; document.body.appendChild(ov);
  document.body.classList.add("inexam");
  examRender();
};
function examClose() {
  clearInterval(EX.tick); EX.lp && (EX.lp.on = false); TTS.stop(); REC.stop && REC.stop(true);
  $$("#exam").forEach(x => x.remove()); document.body.classList.remove("inexam");
  if (R.view === "mock") renderMain();
}
function exSets() {
  const m = MOCKS.find(x => x.id === U.exam.mid);
  return U.exam.sec === "L" ? m.L.map(findL) : U.exam.sec === "R" ? m.R.map(findR) : m.W.map(findW);
}
function examRender() {
  const e = U.exam, m = MOCKS.find(x => x.id === e.mid), ov = $("#exam"); if (!ov) return;
  clearInterval(EX.tick);
  const head = `<header class="exhead"><span class="logo" style="width:34px;height:34px">${bbMascot("happy")}</span><div class="exttl"><b>${esc(m.name)}</b><small>${esc(U.name)} · ${e.secs.map(s => s === e.sec ? `<b style="color:var(--inv)">${SEC_NAME[s]}</b>` : SEC_NAME[s]).join(" → ")}</small></div>
    <span class="spacer"></span><span class="extimer" id="exTimer"></span>
    <button class="btn sm" id="exHide" title="Tạm thoát (bài làm được lưu)">${ic("x")}<span class="hide-narrow2"> Tạm thoát</span></button></header>`;
  let body = "", foot = "";
  if (e.sec === "L") ({ body, foot } = exListening());
  else if (e.sec === "R") ({ body, foot } = exReading());
  else if (e.sec === "W") ({ body, foot } = exWriting());
  else if (e.sec === "S") ({ body, foot } = exSpeaking());
  ov.innerHTML = head + `<main class="exbody" id="exBody">${body}</main>` + (foot ? `<footer class="exfoot">${foot}</footer>` : "");
  $("#exHide").onclick = () => { examClose(); toast("Bài thi được lưu. Vào mục Thi thử để làm tiếp.", "happy"); };
  exRestore(); exBind();
  const t = () => {
    const el = $("#exTimer"); if (!el) return;
    if (e.endsAt) {
      const left = Math.max(0, Math.round((e.endsAt - Date.now()) / 1000));
      el.innerHTML = `${ic("clock")} ${pad(Math.floor(left / 60))}:${pad(left % 60)} <small>còn lại</small>`;
      el.classList.toggle("low", left < 300);
      if (left <= 0) { clearInterval(EX.tick); toast("Hết giờ! Bài làm đã được nộp.", "wow"); exSubmitSection(true); }
    } else if (e.sec === "L") el.innerHTML = `${ic("head")} Part ${Math.min(4, (e.part || 0) + 1)}/4`;
    else el.innerHTML = `${ic("mic")} Speaking`;
  };
  t(); EX.tick = setInterval(t, 1000);
  if (e.sec === "L") exListenStart();
  if (e.sec === "S") exSpeakMount();
}
/* lưu & khôi phục đáp án */
function exCollect() {
  const ov = $("#exam"); if (!ov || !U.exam) return;
  $$("input,select,textarea", ov).forEach(i => {
    if (!i.name) return;
    if (i.type === "radio") { if (i.checked) U.exam.ans[i.name] = i.value; }
    else if (i.type === "checkbox") { U.exam.ans[i.name] = $$(`input[name="${i.name}"]:checked`, ov).map(x => x.value); }
    else if (i.tagName === "TEXTAREA") U.exam.w[i.name] = i.value;
    else U.exam.ans[i.name] = i.value;
  });
  exSave(); exPalette();
}
function exRestore() {
  const ov = $("#exam"), a = U.exam.ans;
  $$("input,select,textarea", ov).forEach(i => {
    if (!i.name) return;
    const v = i.tagName === "TEXTAREA" ? U.exam.w[i.name] : a[i.name];
    if (v == null) return;
    if (i.type === "radio") i.checked = i.value === v;
    else if (i.type === "checkbox") i.checked = (v || []).includes(i.value);
    else i.value = v;
  });
  exPalette();
}
function exBind() {
  const ov = $("#exam");
  ov.addEventListener("input", () => { clearTimeout(EX.st); EX.st = setTimeout(exCollect, 250); });
  ov.addEventListener("change", exCollect);
}
/* bảng số câu */
function exNums(sets, letter) {
  const out = []; let n = 0;
  sets.forEach((s, pi) => s.groups.forEach((g, gi) => g.qs.forEach((q, qi) => {
    const k = g.type === "multi" ? q.a.length : 1;
    out.push({ name: `${letter}${pi}_q${gi}_${qi}`, num: k > 1 ? `${n + 1}–${n + k}` : String(n + 1), part: pi, multi: k });
    n += k;
  })));
  return out;
}
function exPalette() {
  const el = $("#exPal"); if (!el || !U.exam) return;
  const sets = exSets(), L = U.exam.sec;
  el.innerHTML = exNums(sets, L).map(x => {
    const v = U.exam.ans[x.name], done = Array.isArray(v) ? v.length > 0 : v != null && v !== "";
    return `<button class="pq ${done ? "done" : ""} ${x.part === (U.exam.part || 0) ? "cur" : ""}" data-pq="${x.name}" data-pp="${x.part}">${x.num}</button>`;
  }).join("");
  $$("[data-pq]", el).forEach(b => b.onclick = () => {
    if (+b.dataset.pp !== (U.exam.part || 0) && U.exam.sec === "R") { exCollect(); U.exam.part = +b.dataset.pp; save(); examRender(); }
    else if (+b.dataset.pp !== (U.exam.part || 0) && U.exam.sec === "L") { exShowPart(+b.dataset.pp); }
    setTimeout(() => { const q = $(`[data-q="${b.dataset.pq}"]`); q && q.scrollIntoView({ behavior: "smooth", block: "center" }); }, 60);
  });
}

/* ---------- LISTENING ---------- */
function exListening() {
  const sets = exSets(), e = U.exam, p = e.part || 0;
  let start = 0; const starts = sets.map(s => { const v = start; start += qCount(s); return v; });
  const body = `<div class="exlisten">
    <div class="card c-L exaudio" id="exAudio"></div>
    <div class="row"><div class="tabs" id="exPartTabs">${sets.map((s, i) => `<button class="${i === p ? "on" : ""}" data-lp="${i}">Part ${i + 1}</button>`).join("")}</div><span class="tiny">Có thể xem trước câu hỏi của các phần khác.</span></div>
    ${sets.map((s, i) => `<div class="qpanel c-L ${i === p ? "" : "hide"}" data-lpart="${i}"><p class="k" style="font-family:var(--read)"><b>Part ${i + 1}.</b> ${esc(s.context)}</p>${quizHTML(s, { prefix: `L${i}_`, start: starts[i] })}</div>`).join("")}
  </div>`;
  const foot = `<div class="pal" id="exPal"></div><button class="btn pri" id="exNext" style="background:var(--cL);border-color:var(--cL)">${ic("check")} Nộp Listening</button>`;
  return { body, foot };
}
function exShowPart(i) {
  $$("[data-lpart]").forEach(x => x.classList.toggle("hide", +x.dataset.lpart !== i));
  $$("[data-lp]").forEach(x => x.classList.toggle("on", +x.dataset.lp === i));
}
function exAudioPaint(html) { const a = $("#exAudio"); if (a) a.innerHTML = html; }
function exListenStart() {
  const e = U.exam, sets = exSets();
  $$("[data-lp]").forEach(b => b.onclick = () => exShowPart(+b.dataset.lp));
  $("#exNext").onclick = () => modal(`<h3>Nộp phần Listening?</h3><p class="k">${e.phase === "check" ? "" : "Bài nghe chưa phát hết. "}Sau khi nộp sẽ chuyển sang phần tiếp theo và không quay lại được.</p><div class="row"><span class="spacer"></span><button class="btn" data-close>Làm tiếp</button><button class="btn pri" id="ny">Nộp bài</button></div>`, (bx, close) => { $("#ny", bx).onclick = () => { close(); exSubmitSection(false); }; });
  const waitPart = () => {
    const p = e.part || 0;
    if (p >= sets.length) return checkPhase();

      exAudioPaint(`<div class="row"><span class="playbtn" style="background:var(--cL)">${ic("head")}</span><div style="flex:1"><b>Sẵn sàng nghe Part ${p + 1}</b><p class="tiny">Kiểm tra loa hoặc tai nghe. Bấm nút để bắt đầu; bài nghe chỉ phát một lần.</p></div><button class="btn" data-say="This is a sound check. If you can hear this clearly, you are ready.">${ic("vol")} Thử âm thanh</button><button class="btn pri" id="exPlay" style="background:var(--cL);border-color:var(--cL)">${ic("play")} Bắt đầu</button></div>`);

}

function exSubmitSection(auto) {
  const e = U.exam; if (!e) return;

    tmp.remove();
  }
  if (e.sec === "S") e.res.S = { done: true };
  if (e.sec === "W") e.res.W = { done: true };

function exScoreSet(s, P, ans) {
  let c = 0;
  s.groups.forEach((g, gi) => g.qs.forEach((q, qi) => {
    const v = ans[`${P}q${gi}_${qi}`];
    if (g.type === "tfng") c += v === q.a ? 1 : 0;
    else if (g.type === "mcq") c += v != null && v !== "" && +v === q.a ? 1 : 0;
    else if (g.type === "match") c += v != null && v !== "" && +v === q.a ? 1 : 0;
    else if (g.type === "gap") { const x = norm(v); c += x && q.a.some(a => norm(a) === x || norm(a).replace(/ /g, "") === x.replace(/ /g, "")) ? 1 : 0; }
    else if (g.type === "multi") { const p = (v || []).map(Number), hit = p.filter(i => q.a.includes(i)).length; c += Math.max(0, hit - Math.max(0, p.length - q.a.length)); }
  }));
  return { c };
}
function exRestoreInto(root, ans) {
  $$("input,select", root).forEach(i => { const v = ans[i.name]; if (v == null) return; if (i.type === "radio") i.checked = i.value === v; else if (i.type === "checkbox") i.checked = (v || []).includes(i.value); else i.value = v; });
}

  const fresh = GR.subs.filter(s => s.status === "done" && !U.fbSeen[s.id]);
  if (!fresh.length) return "";
  const s = fresh[0];
  return `<div class="result c-W">${bbMascot("cheer")}<div style="flex:1"><h3>Bài viết đã được chấm!</h3><p class="k">${esc(s.title || "Bài viết")}${fbBand(s) ? ` · ≈ <b>${fbBand(s)}</b>` : ""}${fresh.length > 1 ? ` và ${fresh.length - 1} bài khác` : ""}. Mở ra xem nhận xét và các lỗi cần sửa nhé.</p></div><button class="btn pri" ${subNav(s)}>${ic("eye")} Xem nhận xét</button></div>`;
}

/* gắn vào trang Writing */
const _wView = VIEWS.writing;
VIEWS.writing = () => {
  let h = _wView();
  const isTask = R.sub && !["t1", "t2", "phr", "crit"].includes(R.sub);
  if (isTask) {
    h = h.replace('<button class="btn" id="wtpl">', `<button class="btn hide" id="wsend" style="border-color:var(--cW);color:var(--cW)">${ic("up")} Gửi bài chấm</button><button class="btn" id="wtpl">`);
    h = h.replace('<div id="waiout"></div>', '<div id="waiout"></div><div id="gradeBox"></div>');
  } else if (GR.on) {
    h += `<section><div class="sec-h c-W">${ic("bookmark")}<span>Bài đã gửi chấm</span></div><div id="gradeList">${gradeListHTML()}</div></section>`;
  }
  return h;
};
const _wMount = VIEWS.writing_mount;
VIEWS.writing_mount = () => {
  _wMount();
  const t = [...WRITING.task1, ...WRITING.task2].find(x => x.id === R.sub);
  const b = $("#wsend");
  if (t && b) b.onclick = () => gradeSend({ task: t.id, taskNo: t.task, kind: t.kind, title: t.title, prompt: t.prompt, text: $("#wed").value, source: "practice" }, b);
  gradePaint(); gradePoll();
};
/* thẻ báo trên Trang chủ */
const _homeView = VIEWS.home;
VIEWS.home = () => _homeView().replace('<div class="grid2">', '<div id="gradeHome">' + (GR.ready ? gradeHomeHTML() : "") + '</div><div class="grid2">');
/* nút gửi bài ở kết quả thi thử */
const _exResults = exResults;
exResults = function () {
  const e = U.exam, m = e && MOCKS.find(x => x.id === e.mid);
  _exResults();
  if (!GR.on || !m || !e.secs.includes("W")) return;
  m.W.map(findW).forEach((t, i) => {
    const out = $(`[data-waiout="${i}"]`); if (!out) return;
    const b = document.createElement("button"); b.className = "btn sm"; b.style.cssText = "color:var(--cW)"; b.innerHTML = `${ic("up")} Gửi bài Task ${i + 1} chấm`;
    b.onclick = () => gradeSend({ task: t.id, taskNo: t.task, kind: t.kind, title: `${m.name} · Task ${i + 1}: ${t.title}`, prompt: t.prompt, text: e.w["W" + i] || "", source: "mock", mock: m.id }, b);
    out.before(b);
  });
};

/* ================== GIAO DIỆN KIỂU APP (iPad / điện thoại) ==================
   Tự bật trên iPad, iPhone, máy cảm ứng. Xoay ngang: thanh bên kiểu iPadOS. Xoay dọc: thanh tab dưới đáy. */
const UA = navigator.userAgent || "";
const IS_IPAD = /iPad/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_TOUCH = IS_IPAD || /iPhone|Android/.test(UA) || matchMedia("(pointer:coarse)").matches;
const appUI = () => U.ui !== "pc"; // kiểu app iPad là mặc định trên mọi thiết bị
const tabMode = () => appUI() && (innerWidth < 600 || (matchMedia("(orientation: portrait)").matches && innerWidth < 1100));
function applyUI() {
  const r = document.documentElement;
  r.classList.toggle("app-ui", appUI());
  r.classList.toggle("tabmode", tabMode());
  r.classList.toggle("side-off", appUI() && !tabMode() && !!U.sideOff);
  if (!$("#sideFab")) { const f = document.createElement("button"); f.id = "sideFab"; f.className = "sidefab"; f.title = "Mở thanh bên"; f.dataset.sidetog = "1"; f.innerHTML = ic("side"); document.body.appendChild(f); }
}
document.addEventListener("click", e => {
  if (!e.target.closest("[data-sidetog]")) return;
  U.sideOff = !U.sideOff; save(); applyUI();
});
const TABS = [["home", "Hôm nay", "home"], ["practice", "Luyện tập", "spark"], ["vocab", "Từ vựng", "layers"], ["mock", "Thi thử", "trophy"], ["more", "Thêm", "list"]];
const TAB_OF = { home: "home", practice: "practice", listening: "practice", reading: "practice", writing: "practice", speaking: "practice", grammar: "practice", vocab: "vocab", dict: "vocab", notebook: "vocab", mock: "mock", band: "mock", more: "more", plan: "more", guide: "more", settings: "more" };
const VIEW_TITLE = { home: "Hôm nay", practice: "Luyện tập", listening: "Listening", reading: "Reading", writing: "Writing", speaking: "Speaking", grammar: "Ngữ pháp", vocab: "Từ vựng", dict: "Tra từ", notebook: "Sổ từ", mock: "Thi thử", band: "Thi thử", more: "Thêm", plan: "Lộ trình", guide: "Hướng dẫn", settings: "Cài đặt" };
function backTarget() {
  if (R.sub) {
    if (R.view === "speaking" && R.arg != null && R.sub === "p2") return { view: "speaking", sub: "p2", t: "Part 2" };
    if (R.view === "writing" && !["t1", "t2", "phr", "crit"].includes(R.sub)) { const t = [...WRITING.task1, ...WRITING.task2].find(x => x.id === R.sub); return { view: "writing", sub: t && t.task === 1 ? "t1" : "t2", t: "Writing" }; }
    if (R.view === "speaking" || (R.view === "writing" && ["t1", "t2", "phr", "crit"].includes(R.sub))) return tabMode() ? { view: "practice", t: "Luyện tập" } : null;
    if (R.view === "listening" && R.sub === "dictation") return { view: "listening", t: "Listening" };
    if (R.view === "notebook" && R.sub === "review") return { view: "notebook", t: "Sổ từ" };
    return { view: R.view, t: VIEW_TITLE[R.view] };
  }
  if (!tabMode()) return null;
  const tab = TAB_OF[R.view];
  if (tab && tab !== R.view && !(tab === "mock")) return { view: tab, t: VIEW_TITLE[tab] };
  return null;
}
const isq = (c, i) => `<span class="isq c-${c}">${ic(i)}</span>`;
const irow = (nav, c, i, title, sub = "", right = "", extra = "") => `<button class="irow" ${nav} ${extra}>${isq(c, i)}<span class="ibody"><span class="itx"><b>${title}</b>${sub ? `<small>${sub}</small>` : ""}</span>${right}<span class="ichev">${ic("right")}</span></span></button>`;
const ilist = (label, rows) => `<section class="igroup">${label ? `<div class="ilabel">${label}</div>` : ""}<div class="ilist">${rows.join("")}</div></section>`;

/* ---------- thanh bên kiểu iPadOS ---------- */
const _renderSide = renderSide;
renderSide = function () {
  applyUI();
  if (!appUI()) return _renderSide();
  const cur = TAB_OF[R.view] === "more" || TAB_OF[R.view] === "practice" ? R.view : R.view;
  $("#side").innerHTML = `<div class="iside">
    <div class="ibrand"><span class="logo">${bbMascot("happy")}</span><b>${esc(U.name)}</b><button class="sidetog" data-sidetog="1" title="Thu gọn thanh bên">${ic("side")}</button></div>
    <div class="iscroll">
    ${NAV.map(([lab, items]) => `${lab ? `<div class="ilabel">${lab}</div>` : ""}${items.map(([k, n, i, c]) => { const b = navBadge(k); return `<button class="srow ${cur === k || (k === "mock" && cur === "band") ? "on" : ""}" data-nav="${k}">${isq(c, i)}<span>${n}</span>${b ? `<span class="ibadge">${b}</span>` : ""}</button>`; }).join("")}`).join("")}
    <div class="ilabel">Khác</div>
    <button class="srow ${cur === "guide" ? "on" : ""}" data-nav="guide">${isq("L", "help")}<span>Hướng dẫn & đề thi</span></button>
    <button class="srow ${cur === "settings" ? "on" : ""}" data-nav="settings">${isq("N", "gear")}<span>Cài đặt</span></button>
    </div>
    <div class="iseg">${[["light", "sun", "Sáng"], ["dark", "moon", "Tối"]].map(([k, i, n]) => `<button class="${curTheme() === k ? "on" : ""}" data-bbt="${k}">${ic(i)} ${n}</button>`).join("")}</div>
  </div>`;
  renderTabbar();
};
function renderTabbar() {
  let tb = $("#tabbar");
  if (!tb) { tb = document.createElement("nav"); tb.id = "tabbar"; tb.className = "tabbar"; document.body.appendChild(tb); }
  const cur = TAB_OF[R.view] || "home";
  tb.innerHTML = TABS.map(([k, n, i]) => { const b = k === "home" ? navBadge("home") : k === "vocab" ? navBadge("notebook") : ""; return `<button class="${cur === k ? "on" : ""}" data-nav="${k}"><span class="ti">${ic(i)}${b ? `<i>${b}</i>` : ""}</span><span>${n}</span></button>`; }).join("");
}

/* ---------- không có thanh trên cùng: nút quay lại nằm ngay đầu trang ---------- */
const _renderTop = renderTop;
renderTop = function () { if (!appUI()) return _renderTop(); $("#topbar").innerHTML = ""; };
const _renderMain = renderMain;
renderMain = function () {
  _renderMain();
  if (!appUI()) return;
  const bk = backTarget(), v = $("#content .view");
  if (bk && v) {
    const b = document.createElement("button"); b.className = "inback"; b.innerHTML = `${ic("left")}<span>${esc(bk.t)}</span>`;
    b.onclick = () => go(bk.view, bk.sub || null, null); v.prepend(b);
  }
  renderTabbar();
};
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { const was = document.documentElement.classList.contains("tabmode"); applyUI(); if (was !== tabMode()) { renderSide(); renderTop(); } }, 150); });

/* ---------- trang “Luyện tập” và “Thêm” (dùng cho thanh tab) ---------- */
VIEWS.practice = () => {
  const done = k => Object.keys(U.results[k] || {}).length;
  return `${pageHead("D", "spark", "Luyện tập", "Chọn kỹ năng muốn luyện. Mỗi bài có giải thích đáp án bằng tiếng Việt.")}
  ${ilist("4 kỹ năng", [
    irow('data-nav="listening"', "L", "head", "Listening", `${LISTENING.length} bài nghe · đã làm ${done("listening")}`),
    irow('data-nav="reading"', "R", "book", "Reading", `${READING.length} bài đọc · đã làm ${done("reading")}`),
    irow('data-nav="writing"', "W", "pen", "Writing", `${WRITING.task1.length + WRITING.task2.length} đề · ${Object.keys(U.drafts).length} bài đã viết`),
    irow('data-nav="speaking"', "S", "mic", "Speaking", `${SPEAKING.p1.length} chủ đề Part 1 · ${SPEAKING.p2.length} thẻ Part 2`)])}
  ${ilist("Nền tảng", [
    irow('data-nav="grammar"', "G", "abc", "Ngữ pháp", `${GRAMMAR.length} bài · đã làm ${Object.keys(U.grammar).length}`),
    irow('data-nav="listening" data-sub="dictation"', "P", "edit", "Chép chính tả", `${DICTATION.length} câu, 10 phút mỗi ngày`)])}`;
};
VIEWS.more = () => `${pageHead("D", "list", "Thêm", "Hướng dẫn, công cụ và cài đặt.")}
  ${ilist("Công cụ", [irow('data-nav="dict"', "L", "search", "Tra từ", "Nghĩa, phiên âm, ví dụ"), irow('data-nav="notebook"', "R", "bookmark", "Sổ từ & ôn tập", `${U.words.length} từ`, dueWords().length ? `<span class="ibadge">${dueWords().length}</span>` : "")])}
  ${ilist("Khác", [irow('data-nav="guide"', "L", "help", "Hướng dẫn & cấu trúc đề thi"), irow('data-nav="settings"', "N", "gear", "Cài đặt", "Ngày thi, giọng đọc, sao lưu")])}
  <section class="igroup"><div class="ilabel">Giao diện</div><div class="ilist"><div class="irow" style="cursor:default"><span class="isq c-G">${ic("sun")}</span><span class="ibody"><span class="itx"><b>Sáng / Tối</b></span><span class="iseg" style="margin:0">${[["light", "Sáng"], ["dark", "Tối"]].map(([k, n]) => `<button class="${curTheme() === k ? "on" : ""}" data-bbt="${k}">${n}</button>`).join("")}</span></span></div></div></section>`;
const _vocab = VIEWS.vocab;
VIEWS.vocab = () => {
  const h = _vocab();
  if (!appUI() || R.sub) return h;
  return h.replace('<div class="grid-cards">', ilist("", [irow('data-nav="dict"', "L", "search", "Tra từ", "Tra nghĩa Anh – Việt"), irow('data-nav="notebook"', "R", "bookmark", "Sổ từ & ôn tập", `${U.words.length} từ đã lưu`, dueWords().length ? `<span class="ibadge">${dueWords().length} cần ôn</span>` : "")]) + `<div class="ilabel" style="margin-bottom:-10px">Chủ đề</div><div class="grid-cards">`);
};
/* chọn kiểu giao diện trong Cài đặt */
const _settings = VIEWS.settings;
VIEWS.settings = () => _settings().replace('<div class="field"><label>Hình thức thi</label>', `<div class="field"><label>Kiểu giao diện</label><select class="inp" id="sUI"><option value="" ${U.ui !== "pc" ? "selected" : ""}>Kiểu app iPad (mặc định)</option><option value="pc" ${U.ui === "pc" ? "selected" : ""}>Kiểu web máy tính</option></select></div><div class="field"><label>Hình thức thi</label>`);
const _settingsMount = VIEWS.settings_mount;
VIEWS.settings_mount = () => { _settingsMount(); const s = $("#sUI"); if (s) s.onchange = () => { U.ui = s.value; save(); applyUI(); renderSide(); renderMain(); }; };
applyUI();

/* khởi động */
applyTheme();
if (U.collapsed) $("#app").classList.add("collapsed");
(function () { const s = parseHash(); R = s; try { history.replaceState(R, "", location.hash || "#home"); } catch (e) {} renderSide(); renderMain(); })();
setInterval(() => { if (R.view === "home" && !document.querySelector("input:focus,textarea:focus")) { const d = todayKey(); if (d !== window.__day) { window.__day = d; renderMain(); renderSide(); } } }, 60000);
window.__day = todayKey();

</script>
</body>
</html>
